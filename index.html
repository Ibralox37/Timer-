<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080b12;
    color:white;
    font-family:"Rajdhani","Segoe UI",Arial,sans-serif;
}

body{
    touch-action:manipulation;
}

button{
    cursor:pointer;
}

#gameArea{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

#timer{
    font-family:"Orbitron","Rajdhani",Arial,sans-serif;
    font-size:clamp(60px,18vw,125px);
    font-weight:700;
    font-variant-numeric:tabular-nums;
    letter-spacing:2px;
    text-align:center;
    pointer-events:none;
    transition:.15s;
}

#timer.running{
    animation:timerPulse 1.1s ease-in-out infinite;
}

@keyframes timerPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.02)}
}

#info{
    position:fixed;
    top:24px;
    left:50%;
    transform:translateX(-50%);
    width:80%;
    text-align:center;
    font-size:17px;
    font-weight:600;
    letter-spacing:.5px;
    opacity:.8;
    text-shadow:0 2px 8px rgba(0,0,0,.5);
    pointer-events:none;
}

#modeButton,
#designButton,
#profileButton,
#rankingButton{
    position:fixed;
    top:18px;
    z-index:50;
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    padding:12px 16px;
    color:white;
    font-size:15px;
    font-weight:bold;
    font-family:inherit;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    transition:filter .15s,transform .1s;
}

#modeButton:hover,
#designButton:hover,
#profileButton:hover,
#rankingButton:hover{
    filter:brightness(1.18);
}

#modeButton:active,
#designButton:active,
#profileButton:active,
#rankingButton:active{
    transform:scale(.96);
}

#modeButton{right:18px}
#designButton{left:18px}

#profileButton{
    right:18px;
    top:70px;
    padding:10px 13px;
}

#rankingButton{
    right:18px;
    top:122px;
    padding:10px 13px;
}

#modeMenu,
#designMenu{
    position:fixed;
    top:68px;
    width:250px;
    padding:9px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:18px;
    background:rgba(24,34,56,.97);
    box-shadow:0 20px 60px rgba(0,0,0,.55);
    display:none;
    z-index:100;
}

#modeMenu{
    right:18px;
    max-height:80vh;
    overflow-y:auto;
}

#designMenu{
    left:18px;
    max-height:80vh;
    overflow-y:auto;
}

#modeMenu.open,
#designMenu.open{
    display:block;
}

.modeButton,
.designChoice{
    width:100%;
    margin:4px 0;
    padding:13px;
    border:0;
    border-radius:11px;
    background:#2b3955;
    color:white;
    text-align:left;
    font-size:15px;
    font-family:inherit;
    font-weight:600;
    transition:background .15s,transform .1s;
}

.modeButton:hover,
.designChoice:hover{
    background:#37486b;
}

.modeButton:active,
.designChoice:active{
    transform:scale(.98);
}

.modeButton.active{
    outline:2px solid #168cff;
}

/* --- Kategorie-Kacheln (Ebene 1 im Modus-Menü) --- */

#modeCats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.modeCat{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    min-height:86px;
    padding:12px 6px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    background:linear-gradient(160deg,#2b3955,#1d2740);
    color:white;
    font-family:inherit;
    cursor:pointer;
    transition:transform .1s,filter .15s;
}

.modeCat:hover{ filter:brightness(1.2); }
.modeCat:active{ transform:scale(.96); }

.catIcon{ font-size:26px; line-height:1; }

.catName{
    font-size:15px;
    font-weight:700;
    letter-spacing:.3px;
}

.catHint{
    font-size:11px;
    opacity:.6;
}

.menuTitle{
    font-family:"Orbitron",sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:2px;
    opacity:.65;
    text-align:center;
    margin:8px 0 4px;
}

.backButton{
    background:#1b2436 !important;
    opacity:.9;
}

/* --- Streak-Anzeige im Spiel --- */

#streakBox{
    position:fixed;
    top:74px;
    left:50%;
    transform:translateX(-50%) scale(.8);
    z-index:45;
    padding:7px 16px;
    border-radius:20px;
    background:linear-gradient(90deg,#ff6a00,#ff2d55);
    box-shadow:0 6px 22px rgba(255,80,0,.45);
    font-family:"Orbitron",sans-serif;
    font-weight:700;
    font-size:16px;
    white-space:nowrap;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s,transform .25s;
}

#streakBox.show{
    opacity:1;
    transform:translateX(-50%) scale(1);
}

#streakBox.pop{
    animation:streakPop .45s ease;
}

@keyframes streakPop{
    0%{ transform:translateX(-50%) scale(1); }
    45%{ transform:translateX(-50%) scale(1.28); }
    100%{ transform:translateX(-50%) scale(1); }
}

/* --- PERFECT!-Einblendung --- */

#perfectBanner{
    position:fixed;
    top:38%;
    left:50%;
    transform:translate(-50%,-50%) scale(.4);
    z-index:900;
    font-family:"Orbitron",sans-serif;
    font-size:clamp(34px,9vw,74px);
    font-weight:900;
    letter-spacing:3px;
    color:#fff;
    text-shadow:
        0 0 14px #00d4ff,
        0 0 34px #0088ff,
        0 0 70px #0055ff;
    opacity:0;
    pointer-events:none;
}

#perfectBanner.go{
    animation:perfectBannerIn 1.15s cubic-bezier(.15,1.4,.4,1) forwards;
}

@keyframes perfectBannerIn{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(.4) rotate(-8deg); }
    22%{ opacity:1; transform:translate(-50%,-50%) scale(1.15) rotate(2deg); }
    38%{ transform:translate(-50%,-50%) scale(1) rotate(0deg); }
    75%{ opacity:1; transform:translate(-50%,-58%) scale(1); }
    100%{ opacity:0; transform:translate(-50%,-78%) scale(.92); }
}

/* aufsteigende Punkte-Zahl */

#pointsPop{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:890;
    font-family:"Orbitron",sans-serif;
    font-size:clamp(20px,5vw,34px);
    font-weight:700;
    color:#ffd24a;
    text-shadow:0 0 16px rgba(255,210,74,.8);
    opacity:0;
    pointer-events:none;
}

#pointsPop.go{
    animation:pointsUp 1.1s ease-out forwards;
}

@keyframes pointsUp{
    0%{ opacity:0; transform:translate(-50%,-30%) scale(.7); }
    25%{ opacity:1; transform:translate(-50%,-60%) scale(1.1); }
    100%{ opacity:0; transform:translate(-50%,-130%) scale(1); }
}

/* --- Gesperrte Themes --- */

.designChoice.locked{
    opacity:.45;
    cursor:not-allowed;
}

.designChoice .lockInfo{
    float:right;
    font-size:12px;
    opacity:.8;
}

.designChoice.active{
    outline:2px solid white;
}

#neonControl{
    margin-top:9px;
    padding-top:10px;
    border-top:1px solid rgba(255,255,255,.2);
}

#neonButton,
#soundButton{
    width:100%;
    border:0;
    border-radius:11px;
    padding:13px;
    background:#111827;
    color:white;
    font-size:15px;
    font-weight:bold;
    font-family:inherit;
}

#panel{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:min(91%,440px);
    max-height:86vh;
    overflow-y:auto;
    padding:25px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:22px;
    background:#182238;
    box-shadow:0 25px 80px rgba(0,0,0,.65);
    display:none;
    z-index:200;
}

#panel.open{
    display:block;
}

#panel h2{
    margin-top:0;
}

input{
    width:100%;
    padding:14px;
    margin:5px 0 12px;
    border:0;
    border-radius:10px;
    font-size:17px;
    user-select:text;
}

.panelButton{
    width:100%;
    padding:14px;
    margin-top:8px;
    border:0;
    border-radius:11px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-family:inherit;
    font-weight:600;
    transition:filter .15s,transform .1s;
}

.panelButton:hover{
    filter:brightness(1.12);
}

.panelButton:active{
    transform:scale(.98);
}

.panelButton.secondary{
    background:#475569;
}

.panelButton.danger{
    background:#dc2626;
}

#timer.perfect{
    animation:perfectAnimation .7s ease;
}

@keyframes perfectAnimation{
    0%{transform:scale(1)}
    35%{transform:scale(1.35)}
    65%{transform:scale(.9)}
    100%{transform:scale(1)}
}

#confettiCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:999;
}

/* Bildschirm-Blitz (GO, Fehler, Perfekt) */

#flash{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0;
    z-index:40;
    transition:opacity .35s ease-out;
}

#flash.on{
    opacity:.28;
    transition:opacity .05s;
}

/* Herausfordern- und Freunde-Knopf */

#shareButton,
#friendsButton{
    position:fixed;
    bottom:18px;
    z-index:50;
    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;
    padding:12px 16px;
    color:white;
    font-size:15px;
    font-weight:bold;
    font-family:inherit;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    transition:filter .15s,transform .1s;
}

#shareButton{ left:18px; }
#friendsButton{ right:18px; }

#shareButton:hover,
#friendsButton:hover{
    filter:brightness(1.18);
}

#shareButton:active,
#friendsButton:active{
    transform:scale(.96);
}

/* Badge fuer offene Anfragen/Einladungen */

#friendsBadge{
    display:none;
    position:absolute;
    top:-8px;
    right:-8px;
    min-width:20px;
    height:20px;
    line-height:20px;
    padding:0 5px;
    border-radius:10px;
    background:#dc2626;
    color:white;
    font-size:12px;
    text-align:center;
}

/* Listen in den Freunde-Dialogen */

.friendRow{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 10px;
    margin:5px 0;
    border-radius:10px;
    background:rgba(255,255,255,.06);
}

.friendRow .name{
    flex:1;
    text-align:left;
    font-weight:600;
}

.miniButton{
    border:0;
    border-radius:8px;
    padding:7px 11px;
    font-size:13px;
    font-weight:600;
    font-family:inherit;
    color:white;
    background:#2563eb;
    cursor:pointer;
}

.miniButton.green{ background:#16a34a; }
.miniButton.red{ background:#dc2626; }
.miniButton.grey{ background:#475569; }

/* Level-Balken */

.levelBar{
    width:100%;
    height:12px;
    border-radius:8px;
    background:rgba(255,255,255,.12);
    overflow:hidden;
    margin:6px 0 4px;
}

.levelFill{
    height:100%;
    border-radius:8px;
    background:linear-gradient(90deg,#00aaff,#0055ff);
    transition:width .5s ease;
}

/* Statistik-Kacheln */

.statGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:12px 0;
}

.statCard{
    background:rgba(255,255,255,.06);
    border-radius:12px;
    padding:12px;
    text-align:center;
}

.statCard .val{
    font-family:"Orbitron",sans-serif;
    font-size:22px;
    font-weight:700;
    color:#00aaff;
}

.statCard .lbl{
    font-size:12px;
    opacity:.7;
    margin-top:3px;
}

/* Erfolgs-Toast */

#toast{
    position:fixed;
    top:-120px;
    left:50%;
    transform:translateX(-50%);
    z-index:6000;
    min-width:240px;
    max-width:90%;
    padding:14px 20px;
    border-radius:16px;
    background:linear-gradient(135deg,#1b2a4a,#0d1626);
    border:1px solid rgba(0,170,255,.5);
    box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 30px rgba(0,136,255,.3);
    text-align:center;
    transition:top .5s cubic-bezier(.2,1.3,.4,1);
    pointer-events:none;
}

#toast.show{ top:24px; }

#toast .toastTitle{
    font-weight:700;
    font-size:17px;
}

#toast .toastText{
    font-size:14px;
    opacity:.85;
    margin-top:2px;
}

/* Eigene Meldungsfenster statt der grauen Browser-Kästen */

#dialogOverlay{
    position:fixed;
    inset:0;
    z-index:7000;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(4,8,16,.72);
    backdrop-filter:blur(4px);
}

#dialogOverlay.open{ display:flex; }

.dialogBox{
    width:min(92%,420px);
    padding:26px 24px 22px;
    border:1px solid rgba(255,255,255,.13);
    border-radius:22px;
    background:linear-gradient(160deg,#1b2942,#111a2b);
    box-shadow:0 28px 80px rgba(0,0,0,.7),0 0 40px rgba(0,136,255,.15);
    text-align:center;
    animation:dialogIn .28s cubic-bezier(.2,1.3,.4,1);
}

@keyframes dialogIn{
    0%{ opacity:0; transform:scale(.85) translateY(14px); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
}

.dialogIcon{
    font-size:42px;
    line-height:1;
    margin-bottom:8px;
}

.dialogTitle{
    font-family:"Orbitron",sans-serif;
    font-size:19px;
    font-weight:700;
    margin-bottom:8px;
}

.dialogText{
    font-size:16px;
    opacity:.88;
    line-height:1.5;
    white-space:pre-line;
}

.dialogButtons{
    display:flex;
    gap:9px;
    margin-top:18px;
}

.dialogButtons .panelButton{ margin-top:0; }

/* Admin-Knopf im Spiel (nur für Admins sichtbar) */

#adminButton{
    position:fixed;
    top:18px;
    left:18px;
    margin-top:56px;
    z-index:50;
    border:1px solid rgba(255,120,90,.45);
    border-radius:14px;
    padding:12px 16px;
    color:white;
    font-family:"Orbitron",sans-serif;
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    background:linear-gradient(90deg,#ff3b4e,#ff8c42);
    box-shadow:0 6px 20px rgba(255,60,80,.35);
    transition:filter .15s,transform .1s;
}

#adminButton:hover{ filter:brightness(1.15); }
#adminButton:active{ transform:scale(.96); }

/* Kacheln im Admin-Menü */

.adminGrid{
    display:grid;
    grid-template-columns:1fr;
    gap:9px;
    margin:10px 0 4px;
}

.adminTile{
    display:flex;
    align-items:center;
    gap:12px;
    padding:15px 14px;
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    background:linear-gradient(160deg,#2b3955,#1d2740);
    color:white;
    font-family:inherit;
    text-align:left;
    cursor:pointer;
    transition:filter .15s,transform .1s;
}

.adminTile:hover{ filter:brightness(1.2); }
.adminTile:active{ transform:scale(.98); }

.adminTile .tIcon{ font-size:26px; }
.adminTile .tName{ font-size:16px; font-weight:700; }
.adminTile .tHint{ font-size:12px; opacity:.6; }

.adminTile.danger{
    background:linear-gradient(160deg,#5a1e28,#3a1219);
    border-color:rgba(255,90,70,.4);
}

/* ADMIN-Kennzeichnung */

.adminTag{
    display:inline-block;
    margin-left:6px;
    padding:3px 9px;
    border-radius:20px;
    background:linear-gradient(90deg,#ff3b4e,#ff8c42);
    box-shadow:0 0 14px rgba(255,60,80,.5);
    font-family:"Orbitron",sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:1px;
    vertical-align:middle;
}

/* Admin-Leiste über der Bestenliste (außer Konkurrenz) */

.adminBar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 12px;
    margin:2px 0 12px;
    border-radius:12px;
    border:1px solid rgba(255,90,70,.45);
    background:linear-gradient(135deg,rgba(255,60,80,.16),rgba(255,140,66,.10));
}

.adminBar .rankName{
    flex:1;
    text-align:left;
    font-weight:700;
}

.adminBar .adminScore{
    font-family:"Orbitron",sans-serif;
    font-weight:700;
    color:#ff8c42;
}

.adminNote{
    font-size:11px;
    opacity:.6;
    margin:-8px 0 10px;
}

/* Gebannte Spieler im Admin-Menü */

.friendRow.bannedRow{
    opacity:.5;
    border:1px dashed rgba(255,60,80,.5);
}

/* Level-Chip auf dem Anmelde-/Profilbereich */

.levelChip{
    display:inline-block;
    padding:3px 10px;
    border-radius:20px;
    background:linear-gradient(90deg,#0055ff,#00aaff);
    font-family:"Orbitron",sans-serif;
    font-weight:700;
    font-size:13px;
    margin-left:6px;
}

/* =========================
   KONTO
========================= */

#accountScreen{
    position:fixed;
    inset:0;
    z-index:5000;
    background:#080b12;
    display:flex;
    align-items:center;
    justify-content:center;
}

.accountBox{
    width:min(90%,420px);
    background:#182238;
    border:1px solid rgba(255,255,255,.1);
    border-radius:25px;
    padding:30px;
    box-shadow:0 25px 80px rgba(0,0,0,.7);
    text-align:center;
}

.accountLogo{
    font-size:42px;
    font-weight:1000;
    letter-spacing:7px;
    text-shadow:0 0 15px #0088ff;
}

.accountLogoBild{
    display:block;
    width:80%;
    max-width:300px;
    margin:0 auto 5px;
    filter:drop-shadow(0 0 14px rgba(0,136,255,.5));
}

.accountBox h2{
    margin:12px 0 25px;
}

.profileImage{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:10px auto 20px;
    border:3px solid #168cff;
}

.rankRow{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    margin:6px 0;
    border-radius:10px;
    background:rgba(255,255,255,.07);
}

.rankNumber{
    width:35px;
    font-weight:bold;
}

.rankAvatar{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
}

.rankName{
    flex:1;
    text-align:left;
}

.rankScore{
    font-weight:bold;
}

.smallText{
    opacity:.7;

    0%{

    60%{
        opacity:1;
        filter:blur(0);
    }
    100%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1) rotate(0deg);
        filter:blur(0);
    }

@keyframes logoFloat{

function resizeImage(dataUrl, size, callback){

    const img = new Image();

    img.onload = function(){

        const canvas =
            document.createElement("canvas");

        canvas.width = size;
        canvas.height = size;

        const ctx =
            canvas.getContext("2d");

        const min =
            Math.min(img.width, img.height);

        ctx.drawImage(
            img,
            (img.width - min) / 2,
            (img.height - min) / 2,
            min,
            min,
            0,
            0,
            size,
            size
        );

        callback(
            canvas.toDataURL("image/jpeg", 0.8)
        );

    };

    img.src = dataUrl;

}

function authErrorText(error){

    const message =
        String((error && error.message) || "");

    if(message.includes("already registered"))
        return "Dieser Benutzername ist bereits vergeben.";

    if(message.includes("Invalid login credentials"))
        return "Falscher Benutzername oder falsches Passwort.";

    if(message.includes("Password should be"))
        return "Das Passwort muss mindestens 6 Zeichen haben.";

    if(
        message.includes("fetch") ||
        message.includes("network") ||
        message.includes("Failed")
    )
        return "Keine Verbindung zum Server. Prüfe dein Internet.";

    return "Fehler: " + message;

}

async function createAccount(username, password){

    const { data, error } =
        await supabaseClient.auth.signUp({

            email:
                usernameToEmail(username),

            password:
                password,

            options:{
                data:{ username: username }
            }

        });

    if(error)throw error;

    const { error: profileError } =
        await supabaseClient
            .from("profiles")
            .insert({
                id: data.user.id,
                username: username
            });

    if(profileError){

        if(
            String(profileError.message)
                .includes("duplicate")
        ){

            throw new Error(
                "Dieser Benutzername ist bereits vergeben."
            );

        }

        throw profileError;

    }

    finishLogin(
        username,
        data.user.id,
        emptyProfile()
    );

}


async function loginAccount(username, password){

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email:
                usernameToEmail(username),

            password:
                password

        });

    if(error)throw error;

    await loadProfile(data.user);

}


async function loadProfile(user){

    const { data, error } =
        await supabaseClient
            .from("profiles")
            .select("username,image,perfects,ranks,is_admin,banned")
            .eq("id", user.id)
            .maybeSingle();

    if(error)throw error;

    if(data){

        isAdmin = data.is_admin === true;

        finishLogin(
            data.username,
            user.id,
            {
                image:
                    data.image || "",

                perfects:
                    data.perfects || 0,

                ranks:
                    data.ranks ||
                    emptyProfile().ranks
            }
        );

        return;

    }

    /* Profil fehlt (z.B. abgebrochene Registrierung)
       → still neu anlegen */

    const username =
        (
            user.user_metadata &&
            user.user_metadata.username
        ) ||
        "Spieler" + String(user.id).slice(0, 6);

    await supabaseClient
        .from("profiles")
        .insert({
            id: user.id,
            username: username
        });

    finishLogin(
        username,
        user.id,
        emptyProfile()
    );

}

/* =====================================================
   SOUND (Web Audio, keine Dateien noetig)
===================================================== */

let soundEnabled =
    localStorage.getItem("kronixSound") !== "0";

let audioContext =
    null;

function playTone(frequency, duration, type, volume, delay){

    if(!soundEnabled)return;

    try{

        if(!audioContext){

            audioContext =
                new (window.AudioContext ||
                     window.webkitAudioContext)();

        }

        const t0 =
            audioContext.currentTime +
            (delay || 0);

        const osc =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        osc.type =
            type || "sine";

        osc.frequency.value =
            frequency;

        gain.gain.setValueAtTime(
            volume || 0.12,
            t0
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            t0 + duration
        );

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start(t0);
        osc.stop(t0 + duration);

    }catch(error){

        /* Ohne Sound geht das Spiel normal weiter */

    }
}

function soundFail(){ playTone(140, 0.25, "sawtooth", 0.12); }

function formatTime(milliseconds){

    const seconds =
        Math.floor(
            milliseconds / 1000
        );

    const hundredths =
        Math.floor(
            (milliseconds % 1000) / 10
        );

    return String(seconds)
        .padStart(2,"0")
        + "."
        +
        String(hundredths)
        .padStart(2,"0");

}


/* =====================================================
   GENAUIGKEIT
===================================================== */

/*
   WICHTIG:
   Es zählt die Zeit, die der Spieler SIEHT.
   Der Timer zeigt nur Hundertstel an (01.00),
   also wird auch mit Hundertsteln gerechnet.
   Sonst zeigt der Bildschirm 1.00, aber die
   Genauigkeit ist trotzdem nicht 100 %.
*/

function shownTime(actual){

    return Math.floor(
        actual * 100 + 0.000001
    ) / 100;

}


function calculateAccuracy(
    actual,
    target
){

    if(target <= 0)
        return 0;

    const difference =
        Math.abs(
            shownTime(actual) - target
        );

    let accuracy =
        100 -
        (
            difference /
            target *
            100
        );

    accuracy =
        Math.max(
            0,
            accuracy
        );

    /*
       Immer auf 2 Nachkommastellen
       runden.
    */

    return Math.round(
        accuracy * 100
    ) / 100;

}


function accuracyText(
    accuracy
){

    return accuracy
        .toFixed(2)
        .replace(".",",")
        + " %";

}


/*
   Ein echter Treffer:
   Auf dem Bildschirm steht exakt die Zielzeit.
   (Gleiche Regel wie bei der Genauigkeit –
   Anzeige und Wertung passen immer zusammen.)
*/

function isPerfectTarget(
    actual,
    target
){

    return Math.abs(
        shownTime(actual) - target
    ) < 0.005;

}

/* Anzeige des Punktestands je Modus:
   Treffer-Modi zaehlen 100%-Erfolge,
   Reaktion = beste Zeit, Survival = beste Runde */

function scoreLabel(mode, score){

    if(mode === "reaction"){

        return score > 0
            ? "⚡ " + score + " ms"
            : "⚡ –";

    }

    if(mode === "survival"){

        return "🔥 " + score;

    }

    return "🏆 " + score;

}


function rankingAllowed(){

    return Object.prototype.hasOwnProperty.call(
        rankingNames,
        currentMode
    );

}


function updateRankingButton(){

    if(!rankingAllowed()){

        rankingButton.style.display =
            "none";

        return;

    }

    rankingButton.style.display =
        "block";

    const account =
        getCurrentAccount();

    const score =
        account &&
        account.ranks
        ? account.ranks[currentMode] || 0
        : 0;

    rankingButton.textContent =
        scoreLabel(
            currentMode,
            Number(score)
        );

}


function addPerfect(){

    const profile =
        getCurrentAccount();

    if(!profile)return;

    profile.perfects =
        Number(
            profile.perfects || 0
        ) + 1;

    if(rankingAllowed()){

        if(!profile.ranks)
            profile.ranks =
                emptyProfile().ranks;

        profile.ranks[currentMode] =
            Number(
                profile.ranks[currentMode] || 0
            ) + 1;

    }

    checkLevelUp();
    checkAchievements();

    if(isGuest){

        saveGuestProfile(profile);
        checkAchievements();

    }else if(
        isOnline() &&
        rankingAllowed()
    ){

        /* Der Server zählt selbst mit und prüft,
           ob der Treffer plausibel ist. Seine
           Antwort ist die Wahrheit. */

        supabaseClient
            .rpc("add_perfect", {
                mode: currentMode
            })
            .then(
                function(result){

                    if(
                        result.data &&
                        currentProfile &&
                        !isGuest
                    ){

                        currentProfile.ranks =
                            result.data;

                    }

                    updateRankingButton();

                }
            );

    }

    updateRankingButton();

}

   Survival: hoeher ist besser). Der Server prueft
   die Plausibilitaet und speichert nur echte Rekorde. */

function submitBest(mode, value){

    const profile =
        getCurrentAccount();

    if(!profile)return;

    if(!profile.ranks)
        profile.ranks =
            emptyProfile().ranks;

    const current =
        Number(profile.ranks[mode] || 0);

    const better =
        mode === "reaction"
        ? (current === 0 || value < current)
        : value > current;

    if(!better){

        updateRankingButton();

        return;

    }

    profile.ranks[mode] =
        value;

    checkAchievements();

    if(isGuest){

        saveGuestProfile(profile);

    }else if(isOnline()){

        supabaseClient
            .rpc("submit_best", {
                mode: mode,
                value: value
            })
            .then(
                function(result){

                    if(
                        result.data &&
                        currentProfile &&
                        !isGuest
                    ){

                        currentProfile.ranks =
                            result.data;

                    }

                    updateRankingButton();

                }
            );

    }

    updateRankingButton();

}

            .from("profiles")

        : currentMode === "survival"

        : "🌐 Globale Rangliste – 100%-Erfolge in diesem Modus";

/* =====================================================
   KONFETTI
===================================================== */

function startConfetti(){

    const canvas =
        confettiCanvas;

    const ctx =
        canvas.getContext(
            "2d"
        );

    canvas.width =
        innerWidth;

    canvas.height =
        innerHeight;

    const colors = [

        "#00aaff",
        "#ffffff",
        "#0055ff",
        "#66ccff"

    ];

    const pieces = [];

    for(
        let i = 0;
        i < 150;
        i++
    ){

        pieces.push({

            x:
                innerWidth / 2,

            y:
                innerHeight / 2,

            vx:
                (Math.random() - .5) * 16,

            vy:
                (Math.random() - .8) * 16,

            size:
                Math.random() * 8 + 4,

            rotation:
                Math.random() * 360,

            rotationSpeed:
                (Math.random() - .5) * 16,

            life:
                1,

            color:
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ]

        });

    }

    function draw(){

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        let alive =
            false;

        pieces.forEach(
            function(piece){

                if(
                    piece.life <= 0
                )
                    return;

                alive =
                    true;

                piece.x +=
                    piece.vx;

                piece.y +=
                    piece.vy;

                piece.vy +=
                    .35;

                piece.rotation +=
                    piece.rotationSpeed;

                piece.life -=
                    .012;

                ctx.save();

                ctx.globalAlpha =
                    Math.max(
                        0,
                        piece.life
                    );

                ctx.translate(
                    piece.x,
                    piece.y
                );

                ctx.rotate(
                    piece.rotation *
                    Math.PI /
                    180
                );

                ctx.fillStyle =
                    piece.color;

                ctx.fillRect(
                    -piece.size / 2,
                    -piece.size / 2,
                    piece.size,
                    piece.size * 1.8
                );

                ctx.restore();

            }
        );

        if(alive){

            requestAnimationFrame(
                draw
            );

        }

    }

    draw();

}

===================================================== */

gameArea.addEventListener(
    "pointerup",
    function(event){

        event.preventDefault();

        /* Zeitstempel des ECHTEN Klicks mitgeben —
           genauer als die Zeit im Programm */

        handleGameTap(
            event.timeStamp
        );

    }
);


function handleGameTap(eventTime){

    const tapTime =
        eventTime || performance.now();

    /*
       Reaktionstest hat eine
       eigene Steuerung.
    */

    if(currentMode === "reaction"){

        handleReactionTap(tapTime);

        return;

    }

    /*
       Ergebnis anklicken =
       neue Runde.
    */

    if(resultVisible){

        if(currentMode === "survival"){

            createSurvivalTarget();

        }else if(currentMode === "battle"){

            /* gleiche Zielzeit jede Runde,
               kein neues Ziel wuerfeln */

            resultVisible = false;

            challengeTarget =
                Number(activeBattle.target);

        }else{

            createNewTarget();

        }

        /*
           Direkt wieder loslaufen —
           kein extra Tipp noetig,
           in ALLEN Modi.
        */

        startRun(tapTime);

        return;

    }


    /*
       START
    */

    if(!running){

        startRun(tapTime);

        return;

    }


    function startRun(startAt){

        startTime =
            startAt || performance.now();

        elapsedTime =
            0;

        running =
            true;

        soundStart();

        timer.classList.add(
            "running"
        );


        if(
            currentMode ===
            "normal"
        ){

            info.textContent =
                "Tippe zum Stoppen";

        }


        if(
            currentMode ===
            "blind"
        ){

            info.textContent =
                "🕶️ Stoppe nach Gefühl";

        }


        if(
            currentMode ===
            "challenge"
        ){

            info.textContent =
                "🎯 Stoppe genau bei " +
                challengeTarget.toFixed(2) +
                " Sekunden";

        }


        if(
            currentMode ===
            "challengeBlind"
        ){

            info.textContent =
                "🎯🕶️ Stoppe bei " +
                challengeTarget.toFixed(2) +
                " – Timer versteckt";

        }


        if(
            currentMode === "oneSecond" ||
            currentMode === "fiveSecond" ||
            currentMode === "tenSecond"
        ){

            info.textContent =
                "🎯 Stoppe genau bei " +
                challengeTarget.toFixed(2) +
                " Sekunden";

        }


        if(
            currentMode ===
            "survival"
        ){

            info.textContent =
                "🔥 Stoppe bei " +
                challengeTarget.toFixed(2) +
                " (±" +
                survivalTolerance.toFixed(2) +
                ")";

        }


        if(
            currentMode ===
            "battle"
        ){

            info.textContent =
                "⚔️ Runde " +
                (battleRound + 1) +
                "/" + activeBattle.rounds +
                " – Ziel " +
                challengeTarget.toFixed(2) +
                " s";

        }


        if(
            currentMode ===
            "friends"
        ){

            info.textContent =
                friends[currentFriend].name +
                " – Versuch " +
                (currentAttempt + 1) +
                " von " +
                friendAttempts;

        }

        updateTimer();

        return;

    }


    /*
       STOP
    */

    running =
        false;

    soundStop();

    timer.classList.remove(
        "running"
    );

    cancelAnimationFrame(
        animationFrame
    );

    /* Zeit vom echten Klick-Zeitstempel —
       nicht von der Verarbeitung */

    elapsedTime =
        tapTime -
        startTime;

    const actual =
        elapsedTime / 1000;


    if(
        currentMode === "normal" ||
        currentMode === "blind"
    ){

        timer.textContent =
            formatTime(
                elapsedTime
            );

        info.textContent =
            "Gestoppt bei " +
            formatTime(
                elapsedTime
            );

        return;

    }


    if(
        currentMode === "challenge" ||
        currentMode === "challengeBlind" ||
        currentMode === "oneSecond" ||
        currentMode === "fiveSecond" ||
        currentMode === "tenSecond"
    ){

        finishTarget(
            actual
        );

        return;

    }


    if(
        currentMode ===
        "battle"
    ){

        finishBattleRound(
            actual
        );

        return;

    }


    if(
        currentMode ===
        "survival"
    ){

        finishSurvival(
            actual
        );

        return;

    }


    if(
        currentMode ===
        "friends"
    ){

        finishFriendAttempt();

    }

}


/* =====================================================
   SURVIVAL
   Ziel treffen, jede Runde wird die Toleranz
   kleiner. Ein Fehlschlag beendet den Lauf.

function createSurvivalTarget(){

    clearTimeout(
        resultTimer
    );

    resultVisible =
        false;

    challengeTarget =
        Math.round(
            (
                Math.random() *
                6 +
                1
            ) * 100
        ) / 100;

        challengeTarget.toFixed(2);

    info.textContent =
        "🔥 Runde " +

}


function finishSurvival(actual){

    const difference =
        Math.abs(
            shownTime(actual) -
            challengeTarget
        );

    timer.textContent =
        formatTime(
            elapsedTime
        );

    resultVisible =
        true;

    if(
        difference <=
        survivalTolerance + 0.000001
    ){

        survivalRound++;

        survivalTolerance =
            Math.max(
                0.01,
                Math.round(
                    survivalTolerance *
                    0.85 *
                    100
                ) / 100
            );

        /* je weiter, desto mehr Punkte */

        trackRound(null, Math.round(difference * 1000));

        addPoints(5 + survivalRound * 2);

        showPoints(5 + survivalRound * 2);
        showStreak(survivalRound);
        bumpLongestStreak(survivalRound);

        info.textContent =
            "✅ Runde " +
            survivalRound +
            " geschafft! Tippe für Runde " +
            (survivalRound + 1);

        if(difference < 0.005){

            celebratePerfectAnimation();
            showPerfectBanner("PERFECT!");

        }

    }else{

        const runden =
            survivalRound;

        hideStreak();
        trackRound(null, null);

        soundFail();

        flashScreen("#dc2626");

        submitBest(
            "survival",
            runden
        );

        const account =
            getCurrentAccount();

        const rekord =
            account &&
            account.ranks
            ? Number(
                account.ranks.survival || 0
            )
            : 0;

        info.textContent =
            "💀 Daneben! " +
            (
                runden === 1
                ? "1 Runde überlebt"
                : runden + " Runden überlebt"
            ) +
            (
                rekord > 0
                ? " – Rekord: " + rekord
                : ""
            );

        survivalRound =
            0;

        survivalTolerance =
            0.15;

    }

}


/* =====================================================
   REAKTIONSTEST
   Warten auf GO, dann so schnell wie
   moeglich tippen. Beste Zeit zaehlt.
===================================================== */

function resetReaction(){

    clearTimeout(
        reactionTimeout
    );

    reactionState =
        "idle";

    timer.textContent =
        "⚡";

    info.textContent =
        "⚡ Tippe zum Starten – dann warte auf GO!";

}


function handleReactionTap(eventTime){

    const tapTime =
        eventTime || performance.now();

    /* Start: scharf stellen */

    if(
        reactionState === "idle" ||
        reactionState === "result"
    ){

        reactionState =
            "armed";

        timer.textContent =
            "•••";

        info.textContent =
            "Warte auf GO ...";

        const delay =
            1200 +
            Math.random() * 2300;

        reactionTimeout =
            setTimeout(
                function(){

                    reactionState =
                        "go";

                    reactionStart =
                        performance.now();

                    timer.textContent =
                        "GO!";

                    info.textContent =
                        "JETZT TIPPEN!";

                    soundGo();

                    flashScreen("#22c55e");

                },
                delay
            );

        return;

    }

    /* Zu frueh getippt */

    if(reactionState === "armed"){

        clearTimeout(
            reactionTimeout
        );

        reactionState =
            "result";

        timer.textContent =
            "✖";

        info.textContent =
            "Zu früh! Tippe für einen neuen Versuch";

        soundFail();

        flashScreen("#dc2626");

        return;

    }

    /* Reaktion messen */

    if(reactionState === "go"){

        const ms =
            Math.round(
                tapTime -
                reactionStart
            );

        reactionState =
            "result";

        timer.textContent =
            ms + " ms";

        let bewertung;

        if(ms < 10){

            bewertung =
                "👑 REAKTIONSKÖNIG!";

            celebratePerfectAnimation();

        }else if(ms < 50){

            bewertung =
                "🚀 Ultraschnell!";

            celebratePerfectAnimation();

        }else if(ms < 100){

            bewertung =
                "⚡ Sehr schnell!";

            celebratePerfectAnimation();

        }else if(ms < 200){

            bewertung =
                "💨 Schnell!";

        }else if(ms < 300){

            bewertung =
                "👍 Normal";

        }else{

            bewertung =
                "🐢 Langsam";

        }

        /* Statistik + Punkte je nach Tempo */

        const s = getStats();
        s.runden++;
        if(
            s.besteReaktion === null ||
            ms < s.besteReaktion
        ){
            s.besteReaktion = ms;
        }
        saveStats(s);

        addPoints(
            ms < 100 ? 40 :
            ms < 200 ? 25 :
            ms < 300 ? 12 : 5
        );

        showPoints(
            ms < 100 ? 40 :
            ms < 200 ? 25 :
            ms < 300 ? 12 : 5
        );

        if(ms < 100)
            showPerfectBanner(
                ms < 10 ? "KÖNIG!" :
                ms < 50 ? "ULTRA!" : "BLITZ!"
            );

        /* Ab 50 ms geht der Wert in die Weltrangliste.
           Darunter ist es kein Reagieren mehr, sondern
           Raten – der Titel bleibt, der Ranglisten-Platz
           nicht, damit die Liste ehrlich bleibt. */

        const zaehltFuerRangliste =
            ms >= REACTION_MIN;

        if(zaehltFuerRangliste){

            submitBest(
                "reaction",
                ms
            );

        }

        const account =
            getCurrentAccount();

        const rekord =
            account &&
            account.ranks
            ? Number(
                account.ranks.reaction || 0
            )
            : 0;

        info.textContent =
            bewertung +
            (
                !zaehltFuerRangliste
                ? " (Glückstreffer – zählt nicht für die Rangliste)"
                : rekord > 0
                ? " – Rekord: " + rekord + " ms"
                : ""
            ) +
            " – tippe für neuen Versuch";

    }

}


/* Nur die Sieges-Animation, ohne Punkte
   (fuer Survival-Volltreffer und Blitzreflexe) */

function celebratePerfectAnimation(){

    soundPerfect();

    flashScreen("#2e9bff");

    timer.classList.remove(

    );

    void timer.offsetWidth;

    timer.classList.add(

    );

}


/* =====================================================
   ZIEL-MODI AUSWERTEN
===================================================== */

function finishTarget(
    actual
){

    const accuracy =
        calculateAccuracy(
            actual,
            challengeTarget
        );

    timer.textContent =
        formatTime(
            elapsedTime
        );


    /* Runde und Genauigkeit in die Statistik */

    const abweichungMs =
        Math.round(
            Math.abs(actual - challengeTarget) * 1000
        );

    trackRound(accuracy, abweichungMs);


    if(
        isPerfectTarget(
            actual,
            challengeTarget
        )
    ){

        perfectStreak++;

        bumpStreak(perfectStreak);
        bumpLongestStreak(perfectStreak);

        /* Punkte: Grundwert + Streak-Bonus */

        const punkte =
            10 + Math.min(perfectStreak - 1, 10) * 5;

        addPoints(punkte);

        info.textContent =
            "🔥 PERFEKT! 100%" +
            (
                perfectStreak >= 2
                ? " – Serie: " + perfectStreak
                : ""
            );

        celebratePerfect();

        showPerfectBanner(
            perfectStreak >= 5
            ? "PERFECT x" + perfectStreak + "!"
            : "PERFECT!"
        );

        showPoints(punkte);
        showStreak(perfectStreak);

    }else{

        perfectStreak =
            0;

        hideStreak();

        /* Punkte auch für gute Versuche */

        if(accuracy >= 90){

            addPoints(
                accuracy >= 99 ? 5 :
                accuracy >= 95 ? 3 : 1
            );

        }

        info.textContent =
            "Gestoppt bei " +
            formatTime(
                elapsedTime
            ) +
            " – " +
            accuracyText(
                accuracy
            ) +
            " Genauigkeit";

    }


    resultVisible =
        true;


    resultTimer =
        setTimeout(
            function(){

                if(
                    !running &&
                    resultVisible
                ){

                    timer.textContent =
                        accuracyText(
                            accuracy
                        );

                    info.textContent =
                        "🎯 Genauigkeit";

                }

            },
            2000
        );

}

function changeMode(
    newMode
){

    running =
        false;

    cancelAnimationFrame(
        animationFrame
    );

    clearTimeout(
        resultTimer
    );

    clearTimeout(
        reactionTimeout
    );

    reactionState =
        "idle";

    timer.classList.remove(
        "running"
    );

    elapsedTime =
        0;

    resultVisible =
        false;

    currentMode =
        newMode;

    panel.classList.remove(
        "open"
    );

    modeMenu.classList.remove(
        "open"
    );


    const names = {

        normal:
            "Normalmodus",

        blind:
            "Blindmodus",

        challenge:
            "Challenge",

        challengeBlind:
            "Challenge Blind",

        oneSecond:
            "Stoppe bei 1,00",

        fiveSecond:
            "Stoppe bei 5,00",

        tenSecond:
            "Stoppe bei 10,00",

        reaction:
            "Reaktionstest",

        survival:
            "Survival",

        friends:
            "Freunde"

    };


    /* aktiven Modus im Menü markieren */

    document
    .querySelectorAll(
        ".modeButton"
    )
    .forEach(
        function(button){

            button.classList.toggle(
                "active",
                button.dataset.mode ===

function finishFriendAttempt(){

    const actual =
        elapsedTime / 1000;

    const accuracy =
        calculateAccuracy(
            actual,
            friendTarget
        );


    friendScores.push(
        accuracy
    );

    currentAttempt++;


    timer.textContent =
        formatTime(
            elapsedTime
        );


    if(
        isPerfectTarget(
            actual,
            friendTarget
        )
    ){

        info.textContent =
            "🔥 PERFEKT! 100%";

    }else{

        info.textContent =
            accuracyText(
                accuracy
            ) +
            " Genauigkeit";

    }


    if(
        currentAttempt >=
        friendAttempts
    ){

        const average =
            Math.round(
                (
                    friendScores.reduce(
                        (sum,value) =>
                            sum + value,
                        0
                    ) /
                    friendScores.length
                ) * 100
            ) / 100;


        friends[currentFriend].scores =
            friendScores.slice();

        friends[currentFriend].average =
            average;


        setTimeout(
            showFriendResult,
            500
        );

    }

}

/* =====================================================
   LEVEL, STATISTIK & ERFOLGE
===================================================== */

/* Level aus der Gesamtzahl perfekter Treffer.
   Jede Stufe braucht etwas mehr als die vorige. */

function levelInfo(perfects){

    let level = 1;
    let rest = Number(perfects) || 0;
    let need = 5;

    while(rest >= need){

        rest -= need;
        level++;
        need = Math.round(need * 1.35);

    }

    const rang = rankInfo(level);

    return {
        level: level,
        rest: rest,
        need: need,
        prozent: Math.round(rest / need * 100),
        rang: rang.name,
        rangIcon: rang.icon,
        rangFarbe: rang.farbe
    };

}


/* Ränge: Bronze → Silber → Gold → Platin → Diamant → KRONIX */

const RANKS = [
    { ab: 1,  name:"Bronze",  icon:"🥉", farbe:"#cd7f32" },
    { ab: 5,  name:"Silber",  icon:"🥈", farbe:"#c0c0c0" },
    { ab: 10, name:"Gold",    icon:"🥇", farbe:"#ffd24a" },
    { ab: 18, name:"Platin",  icon:"💠", farbe:"#7fe3ff" },
    { ab: 28, name:"Diamant", icon:"💎", farbe:"#b06bff" },
    { ab: 40, name:"KRONIX",  icon:"👑", farbe:"#00d4ff" }
];

function rankInfo(level){

    let treffer = RANKS[0];

    RANKS.forEach(function(r){

        if(level >= r.ab)
            treffer = r;

    });

    return treffer;

}

/* nächster Rang, für die Anzeige „noch X Level bis …" */

function nextRank(level){

    for(let i = 0; i < RANKS.length; i++){

        if(level < RANKS[i].ab)
            return RANKS[i];

    }

    return null;

}


/* =====================================================
   SPIEL-STATISTIK (lokal, geraetebezogen)
   Runden, Genauigkeitssumme, beste Zeit, laengste Streak
===================================================== */

function getStats(){

    try{

        const s =
            JSON.parse(
                localStorage.getItem("kronixStats") || "{}"
            );

        return {
            runden: s.runden || 0,
            genauSumme: s.genauSumme || 0,
            genauAnzahl: s.genauAnzahl || 0,
            besteAbweichung:
                s.besteAbweichung === undefined
                ? null
                : s.besteAbweichung,
            besteReaktion:
                s.besteReaktion === undefined
                ? null
                : s.besteReaktion,
            laengsteStreak: s.laengsteStreak || 0,
            punkte: s.punkte || 0
        };

    }catch{

        return {
            runden:0, genauSumme:0, genauAnzahl:0,
            besteAbweichung:null, besteReaktion:null,
            laengsteStreak:0, punkte:0
        };

    }
}

function saveStats(s){

    localStorage.setItem(
        "kronixStats",
        JSON.stringify(s)
    );

}

/* eine gespielte Runde verbuchen */

function trackRound(accuracy, abweichungMs){

    const s = getStats();

    s.runden++;

    if(typeof accuracy === "number"){

        s.genauSumme += accuracy;
        s.genauAnzahl++;

    }

    if(
        typeof abweichungMs === "number" &&
        (s.besteAbweichung === null ||
         abweichungMs < s.besteAbweichung)
    ){

        s.besteAbweichung = abweichungMs;

    }

    saveStats(s);

}

/* Punkte vergeben (schaltet Themes frei) */

function addPoints(anzahl){

    const s = getStats();

    s.punkte += anzahl;

    saveStats(s);

    checkThemeUnlocks(s.punkte);

    return s.punkte;

}

function getPoints(){

    return getStats().punkte;

}

function durchschnittGenauigkeit(){

    const s = getStats();

    if(s.genauAnzahl === 0)return null;

    return Math.round(
        s.genauSumme / s.genauAnzahl * 100
    ) / 100;

}

/* ---------- Toast (Erfolgs-Einblendung) ---------- */

const toastEl = document.getElementById("toast");
const toastTitleEl = document.getElementById("toastTitle");
const toastTextEl = document.getElementById("toastText");
let toastTimer = null;
let toastQueue = [];
let toastActive = false;

function showToast(title, text){

    toastQueue.push({ title: title, text: text });

    if(!toastActive)
        nextToast();

}

function nextToast(){

    if(toastQueue.length === 0){

        toastActive = false;

        return;

    }

    toastActive = true;

    const t = toastQueue.shift();

    toastTitleEl.textContent = t.title;
    toastTextEl.textContent = t.text;
    toastEl.classList.add("show");

    playTone(660, 0.1, "sine", 0.1);
    playTone(990, 0.12, "sine", 0.1, 0.1);

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(function(){

            toastEl.classList.remove("show");

            setTimeout(nextToast, 450);

        }, 2800);

}

function refreshThemeLocks(){

    const punkte = getPoints();

    document
    .querySelectorAll(".designChoice")
    .forEach(function(btn){

        const name = btn.dataset.design;
        const noetig = THEME_UNLOCKS[name] || 0;

        /* alten Zusatz entfernen */

        const alt = btn.querySelector(".lockInfo");
        if(alt) alt.remove();

        if(punkte >= noetig){

            btn.classList.remove("locked");

        }else{

            btn.classList.add("locked");

/* nach Punktezuwachs prüfen, ob etwas aufgeht */

function checkThemeUnlocks(punkte){

    let bekannt;

    try{

        bekannt =
            new Set(
                JSON.parse(
                    localStorage.getItem("kronixThemes") || "[]"
                )
            );

    }catch{

        bekannt = new Set();

    }

    Object.keys(THEME_UNLOCKS).forEach(function(name){

        const noetig = THEME_UNLOCKS[name];

        if(
            noetig > 0 &&
            punkte >= noetig &&
            !bekannt.has(name)
        ){

            bekannt.add(name);

            showToast(
                "🎨 Neues Theme!",
                (THEME_NAMES[name] || name) +
                " freigeschaltet (" + noetig + " Punkte)"
            );

        }

    });

    localStorage.setItem(
        "kronixThemes",
        JSON.stringify(Array.from(bekannt))
    );

        const alterRang = rankInfo(lastLevelSeen);
        const neuerRang = rankInfo(info.level);

        if(neuerRang.name !== alterRang.name){

            showToast(
                neuerRang.icon + " " + neuerRang.name + "-Rang!",
                "Level " + info.level + " erreicht – neuer Rang!"

    }

    lastLevelSeen = info.level;

    if(adminBtn)
        adminBtn.style.display = "none";

    if(socialChannel){

        supabaseClient.removeChannel(socialChannel);
        socialChannel = null;

    }

}


/* Anzahl offener Anfragen + Einladungen fuer das Badge */

async function refreshBadge(){

    if(!isOnline() || isGuest || !currentUserId)return;

    const anfragen =
        await supabaseClient
            .from("friendships")
            .select("id", { count: "exact", head: true })
            .eq("receiver_id", currentUserId)
            .eq("status", "pending");

    const einladungen =
        await supabaseClient
            .from("battles")
            .select("id", { count: "exact", head: true })
            .eq("guest_id", currentUserId)
            .eq("status", "invited");

    const summe =
        (anfragen.count || 0) +
        (einladungen.count || 0);

    if(summe > 0){

        friendsBadge.textContent = summe;
        friendsBadge.style.display = "block";

    }else{

        friendsBadge.style.display = "none";

    }

}


/* ---------- Freunde-Panel ---------- */

friendsButton.onclick =
function(){

    openFriendsPanel();

};


document.getElementById("adminButton").onclick =
function(){

    openAdminPanel();

};


async function openFriendsPanel(){

    panelTitle.textContent = "👥 Freunde";

    panelContent.innerHTML = `
        <input id="friendSearch" placeholder="Benutzername suchen ...">
        <div id="searchResults"></div>
        <h3 style="margin:14px 0 6px">📨 Anfragen</h3>
        <div id="requestList"><p class="smallText">Lädt ...</p></div>
        <h3 style="margin:14px 0 6px">🎮 Deine Freunde</h3>
        <div id="friendList"><p class="smallText">Lädt ...</p></div>
        <button class="panelButton secondary" id="closeFriends">Schließen</button>
    `;

    panel.classList.add("open");

    document.getElementById("closeFriends").onclick =
        function(){ panel.classList.remove("open"); };

    const suchfeld =
        document.getElementById("friendSearch");

    let suchTimer = null;

    suchfeld.oninput =
    function(){

        clearTimeout(suchTimer);

        suchTimer =
            setTimeout(function(){ doSearch(suchfeld.value.trim()); }, 300);

    };

    loadRequests();
    loadFriends();

}


async function doSearch(begriff){

    const box =
        document.getElementById("searchResults");

    if(!box)return;

    if(begriff.length < 2){

        box.innerHTML = "";

        return;

    }

    const { data } =
        await supabaseClient
            .from("profiles")
            .select("id,username,image")
            .ilike("username", begriff + "%")
            .neq("id", currentUserId)
            .limit(8);

    if(!data || data.length === 0){

        box.innerHTML =
            '<p class="smallText">Niemand gefunden.</p>';

        return;

    }

    box.innerHTML =
        data.map(function(u){

            return '<div class="friendRow">' +
                '<img class="rankAvatar" src="' +
                (u.image || DEFAULT_AVATAR_SMALL) + '">' +
                '<div class="name">' + escapeHTML(u.username) + '</div>' +
                '<button class="miniButton" data-add="' + u.id +
                '" data-name="' + escapeHTML(u.username) +
                '">+ Freund</button></div>';

        }).join("");

    box.querySelectorAll("[data-add]").forEach(function(btn){

        btn.onclick =
        async function(){

            btn.disabled = true;
            btn.textContent = "...";

            const { error } =
                await supabaseClient
                    .from("friendships")
                    .insert({
                        sender_id: currentUserId,
                        receiver_id: btn.dataset.add
                    });

            btn.textContent =
                error ? "schon angefragt" : "✓ gesendet";

        };

    });

}


async function loadRequests(){

    const box =
        document.getElementById("requestList");

    if(!box)return;

    const { data } =
        await supabaseClient
            .from("friendships")
            .select("id,sender_id,status")
            .eq("receiver_id", currentUserId)
            .eq("status", "pending");

    if(!data || data.length === 0){

        box.innerHTML =
            '<p class="smallText">Keine offenen Anfragen.</p>';

        return;

    }

    /* Namen der Absender holen */

    const ids = data.map(function(r){ return r.sender_id; });

    const { data: leute } =
        await supabaseClient
            .from("profiles")
            .select("id,username,image")
            .in("id", ids);

    const nameVon = {};
    (leute || []).forEach(function(p){ nameVon[p.id] = p; });

    box.innerHTML =
        data.map(function(r){

            const p = nameVon[r.sender_id] || { username: "?" };

            return '<div class="friendRow">' +
                '<img class="rankAvatar" src="' +
                ((p.image) || DEFAULT_AVATAR_SMALL) + '">' +
                '<div class="name">' + escapeHTML(p.username) + '</div>' +
                '<button class="miniButton green" data-accept="' + r.id + '">Annehmen</button>' +
                '<button class="miniButton red" data-decline="' + r.id + '">✕</button></div>';

        }).join("");

    box.querySelectorAll("[data-accept]").forEach(function(btn){

        btn.onclick =
        async function(){

            await supabaseClient
                .from("friendships")
                .update({ status: "accepted" })
                .eq("id", btn.dataset.accept);

            loadRequests();
            loadFriends();
            refreshBadge();

        };

    });

    box.querySelectorAll("[data-decline]").forEach(function(btn){

        btn.onclick =
        async function(){

            await supabaseClient
                .from("friendships")
                .delete()
                .eq("id", btn.dataset.decline);

            loadRequests();
            refreshBadge();

        };

    });

}


async function loadFriends(){

    const box =
        document.getElementById("friendList");

    if(!box)return;

    const { data } =
        await supabaseClient
            .from("friendships")
            .select("sender_id,receiver_id,status")
            .eq("status", "accepted");

    if(!data || data.length === 0){

        box.innerHTML =
            '<p class="smallText">Noch keine Freunde. Suche oben nach einem Benutzernamen!</p>';

        return;

    }

    const freundIds =
        data.map(function(f){

            return f.sender_id === currentUserId
                ? f.receiver_id
                : f.sender_id;

        });

    const { data: leute } =
        await supabaseClient
            .from("profiles")
            .select("id,username,image")
            .in("id", freundIds);

    box.innerHTML =
        (leute || []).map(function(p){

            return '<div class="friendRow">' +
                '<img class="rankAvatar" src="' +
                (p.image || DEFAULT_AVATAR_SMALL) + '">' +
                '<div class="name">' + escapeHTML(p.username) + '</div>' +
                '<button class="miniButton" data-battle="' + p.id +
                '" data-name="' + escapeHTML(p.username) +
                '">⚔️ Battle</button></div>';

        }).join("");

    box.querySelectorAll("[data-battle]").forEach(function(btn){

        btn.onclick =
        function(){

            openBattleSetup(btn.dataset.battle, btn.dataset.name);

        };

    });

}


/* ---------- Battle einladen ---------- */

function openBattleSetup(freundId, freundName){

    panelTitle.textContent = "⚔️ Battle gegen " + freundName;

    panelContent.innerHTML = `
        <p>Runden:</p>
        <input id="battleRounds" type="number" min="1" max="20" value="5">
        <p>Zielzeit in Sekunden:</p>
        <input id="battleTarget" type="number" min="0.1" max="30" step="0.01" value="1.00">
        <button class="panelButton" id="sendBattle">Einladung senden</button>
        <button class="panelButton secondary" id="backFriends">Zurück</button>
    `;

    document.getElementById("backFriends").onclick = openFriendsPanel;

    document.getElementById("sendBattle").onclick =
    async function(){

        const runden =
            Math.max(1, Math.min(20,
                parseInt(document.getElementById("battleRounds").value) || 5));

        const ziel =
            Math.max(0.1, Math.min(30,
                parseFloat(document.getElementById("battleTarget").value) || 1));

        this.disabled = true;
        this.textContent = "sende ...";

        const { error } =
            await supabaseClient
                .from("battles")
                .insert({
                    host_id: currentUserId,
                    guest_id: freundId,
                    host_name: currentUser,
                    guest_name: freundName,
                    rounds: runden,
                    target: ziel
                });

        if(error){

            this.textContent = "Fehler – nochmal";
            this.disabled = false;

            return;

        }

        panelTitle.textContent = "⚔️ Einladung gesendet";
        panelContent.innerHTML =
            '<p>Warte, bis ' + escapeHTML(freundName) +
            ' die Herausforderung annimmt ...</p>' +
            '<button class="panelButton secondary" id="closeWait">Schließen</button>';

        document.getElementById("closeWait").onclick =
            function(){ panel.classList.remove("open"); };

    };

}


/* ---------- Einladung empfangen ---------- */

function onBattleInvite(battle){

    soundInvite();
    refreshBadge();

    panelTitle.textContent = "⚔️ Herausforderung!";

    panelContent.innerHTML =
        '<p><strong>' + escapeHTML(battle.host_name) +
        '</strong> fordert dich heraus:</p>' +
        '<p>🎯 ' + battle.rounds + ' Runden – Ziel ' +
        Number(battle.target).toFixed(2) + ' s</p>' +
        '<button class="panelButton" id="acceptBattle">Annehmen ⚔️</button>' +
        '<button class="panelButton secondary" id="declineBattle">Ablehnen</button>';

    panel.classList.add("open");

    document.getElementById("acceptBattle").onclick =
    async function(){

        await supabaseClient
            .from("battles")
            .update({ status: "active" })
            .eq("id", battle.id);

        refreshBadge();
        startBattle(battle, "guest");

    };

    document.getElementById("declineBattle").onclick =
    async function(){

        await supabaseClient
            .from("battles")
            .update({ status: "declined" })
            .eq("id", battle.id);

        refreshBadge();
        panel.classList.remove("open");

    };

}


/* ---------- Battle-Ablauf ---------- */

function startBattle(battle, rolle){

    activeBattle = battle;
    battleRole = rolle;
    battleRound = 0;
    battleAccuracySum = 0;

    panel.classList.remove("open");
    modeMenu.classList.remove("open");

    running = false;
    clearTimeout(resultTimer);
    resultVisible = false;
    timer.classList.remove("running");

    currentMode = "battle";
    challengeTarget = Number(battle.target);

    rankingButton.style.display = "none";

    modeButton.textContent = "⚔️ Battle ▾";

    timer.textContent = challengeTarget.toFixed(2);
    info.textContent =
        "⚔️ Battle vs " +
        (rolle === "host" ? battle.guest_name : battle.host_name) +
        " – Runde 1/" + battle.rounds + " – Ziel " +
        challengeTarget.toFixed(2) + " s";

}


function finishBattleRound(actual){

    const accuracy =
        calculateAccuracy(actual, challengeTarget);

    battleAccuracySum += accuracy;
    battleRound++;

    timer.textContent = formatTime(elapsedTime);
    resultVisible = true;

    if(isPerfectTarget(actual, challengeTarget)){

        celebratePerfectAnimation();

    }

    if(battleRound < activeBattle.rounds){

        info.textContent =
            "Runde " + battleRound + ": " +
            accuracyText(accuracy) +
            " – tippe für Runde " + (battleRound + 1) +
            "/" + activeBattle.rounds;

    }else{

        const schnitt =
            Math.round(
                (battleAccuracySum / activeBattle.rounds) * 100
            ) / 100;

        info.textContent =
            "✅ Fertig! Dein Schnitt: " + accuracyText(schnitt) +
            " – warte auf Gegner ...";

        submitBattleScore(schnitt);

    }

}


async function submitBattleScore(schnitt){

    const feld =
        battleRole === "host" ? "host_score" : "guest_score";

    /* Punkte nur ueber die geschuetzte Funktion —
       niemand kann den Score des Gegners aendern */

    await supabaseClient
        .rpc("submit_battle_score", {
            battle_id: activeBattle.id,
            score: schnitt
        });

    /* eigenen Wert lokal merken und pruefen ob beide fertig */

    activeBattle[feld] = schnitt;
    checkBattleFinished();

}


function onBattleUpdate(battle){

    /* Gegner hat Battle angenommen (Host wartet) */

    if(
        activeBattle == null &&
        battle.status === "active" &&
        battle.host_id === currentUserId
    ){

        startBattle(battle, "host");

        return;

    }

    if(
        activeBattle == null &&
        battle.status === "declined" &&
        battle.host_id === currentUserId
    ){

        panelTitle.textContent = "⚔️ Abgelehnt";
        panelContent.innerHTML =
            '<p>' + escapeHTML(battle.guest_name) +
            ' hat die Herausforderung abgelehnt.</p>' +
            '<button class="panelButton secondary" id="cl">Schließen</button>';
        panel.classList.add("open");
        document.getElementById("cl").onclick =
            function(){ panel.classList.remove("open"); };

        return;

    }

    /* laufendes Battle: Gegner-Score kam rein */

    if(activeBattle && battle.id === activeBattle.id){

        activeBattle.host_score = battle.host_score;
        activeBattle.guest_score = battle.guest_score;
        checkBattleFinished();

    }

}


function checkBattleFinished(){

    if(!activeBattle)return;

    if(
        activeBattle.host_score == null ||
        activeBattle.guest_score == null
    ){

        return;

    }

    const meins =
        battleRole === "host"
        ? Number(activeBattle.host_score)
        : Number(activeBattle.guest_score);

    const gegner =
        battleRole === "host"
        ? Number(activeBattle.guest_score)
        : Number(activeBattle.host_score);

    const gegnerName =
        battleRole === "host"
        ? activeBattle.guest_name
        : activeBattle.host_name;

    let ergebnis;

    if(meins > gegner){

        ergebnis = "🏆 GEWONNEN!";
        soundWin();
        startConfetti();

    }else if(meins < gegner){

        ergebnis = "😔 Verloren";
        soundLose();

    }else{

        ergebnis = "🤝 Unentschieden!";

    }

    if(activeBattle.status !== "finished"){

        supabaseClient
            .from("battles")
            .update({ status: "finished" })
            .eq("id", activeBattle.id);

    }

    panelTitle.textContent = "⚔️ Battle-Ergebnis";
    panelContent.innerHTML =
        '<h1 style="text-align:center">' + ergebnis + '</h1>' +
        '<div class="friendRow"><div class="name">Du</div>' +
        '<div>' + accuracyText(meins) + '</div></div>' +
        '<div class="friendRow"><div class="name">' +
        escapeHTML(gegnerName) + '</div>' +
        '<div>' + accuracyText(gegner) + '</div></div>' +
        '<button class="panelButton" id="battleAgain">Nochmal fordern</button>' +
        '<button class="panelButton secondary" id="battleDone">Fertig</button>';

    panel.classList.add("open");

    const gegnerId =
        battleRole === "host"
        ? activeBattle.guest_id
        : activeBattle.host_id;

    const gName = gegnerName;

    document.getElementById("battleAgain").onclick =
    function(){

        endBattle();
        openBattleSetup(gegnerId, gName);

    };

    document.getElementById("battleDone").onclick =
    function(){

        endBattle();
        panel.classList.remove("open");

    };

}


function endBattle(){

    activeBattle = null;
    battleRole = null;
    battleRound = 0;
    battleAccuracySum = 0;

    changeMode("oneSecond");

}
