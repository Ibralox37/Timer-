<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;

    background:#080b12;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    touch-action:manipulation;
}

button{
    cursor:pointer;
}

#modeButton,

    z-index:50;
    border:0;

    padding:12px 16px;

    font-size:15px;
    font-weight:bold;
}

#modeButton{right:18px}
#designButton{left:18px}

#profileButton{
    right:18px;
    top:70px;
    padding:10px 13px;
}

#rankingButton{
    right:18px;
    top:122px;
    padding:10px 13px;
}

#modeMenu,
#designMenu{
    position:fixed;

}

#modeMenu{

}

.modeButton,

#neonButton{

}

#panel{

========================= */

/* =========================

========================= */

}

}

<script>

/* =====================================================
   SUPABASE-VERBINDUNG (Online-Konten & Rangliste)

   Hier die zwei Werte aus dem Supabase-Projekt eintragen:
   supabase.com → Projekt → Settings → API
   Solange die Platzhalter drinstehen, läuft das Spiel
   im Offline-Modus (nur Gast, Punkte bleiben am Gerät).
===================================================== */

const SUPABASE_URL =
    "https://ygdgqpedwdpbxlicviks.supabase.co";

const SUPABASE_ANON_KEY =
    "sb_publishable_QtZnXFRDB8ypHHmOuY-qLg_MI-52tM5";

const supabaseClient =
    (
        typeof supabase !== "undefined" &&
        SUPABASE_URL.startsWith("https://")
    )
    ? supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    )
    : null;

function isOnline(){
    return supabaseClient !== null;
}

/* =====================================================
   KONTO-SYSTEM

   Konten liegen jetzt auf dem Server (Supabase Auth).
   Passwörter werden dort automatisch verschlüsselt
   gespeichert. Als Gast bleibt alles im localStorage.
===================================================== */

let currentUser = null;      /* Anzeigename */
let currentUserId = null;    /* Server-ID des Kontos */
let currentProfile = null;   /* { image, perfects, ranks } */
let isGuest = false;
let accountLoginMode = false;

const accountScreen =
    document.getElementById("accountScreen");

const accountTitle =
    document.getElementById("accountTitle");

const accountDescription =
    document.getElementById("accountDescription");

const accountUsername =
    document.getElementById("accountUsername");

const accountPassword =
    document.getElementById("accountPassword");

const accountMainButton =
    document.getElementById("accountMainButton");

const accountSwitchButton =
    document.getElementById("accountSwitchButton");


const DEFAULT_AVATAR_BIG =
    'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2290%22 height=%2290%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23334155%22/%3E%3Ctext x=%2250%22 y=%2260%22 text-anchor=%22middle%22 font-size=%2250%22%3E👤%3C/text%3E%3C/svg%3E';

const DEFAULT_AVATAR_SMALL =
    "data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2238%22 height=%2238%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23334155%22/%3E%3Ctext x=%2250%22 y=%2260%22 text-anchor=%22middle%22 font-size=%2225%22%3E👤%3C/text%3E%3C/svg%3E";


function emptyProfile(){

    return {
        image:"",
        perfects:0,
        ranks:{
            challenge:0,
            challengeBlind:0,
            oneSecond:0,
            fiveSecond:0,
            tenSecond:0
        }
    };

}


/* Gast-Punkte bleiben nur auf diesem Gerät */

function getGuestProfile(){

    try{

        return Object.assign(
            emptyProfile(),
            JSON.parse(
                localStorage.getItem(
                    "kronixGuest"
                ) || "{}"
            )
        );

    }catch{

        return emptyProfile();

    }
}


function saveGuestProfile(profile){

    localStorage.setItem(
        "kronixGuest",
        JSON.stringify(profile)
    );

}


/* Profilbild vor dem Speichern verkleinern,
   damit es nicht riesig wird */

function resizeImage(dataUrl, size, callback){

    const img = new Image();

    img.onload = function(){

        const canvas =
            document.createElement("canvas");

        canvas.width = size;
        canvas.height = size;

        const ctx =
            canvas.getContext("2d");

        const min =
            Math.min(img.width, img.height);

        ctx.drawImage(
            img,
            (img.width - min) / 2,
            (img.height - min) / 2,
            min,
            min,
            0,
            0,
            size,
            size
        );

        callback(
            canvas.toDataURL("image/jpeg", 0.8)
        );

    };

    img.src = dataUrl;

}


function updateAccountScreen(){

    const hint =
        document.getElementById("accountHint");

    if(!isOnline()){

        accountTitle.textContent =
            "Offline-Modus";

        accountDescription.textContent =
            "Es ist noch kein Server eingetragen. Du kannst als Gast spielen – deine Punkte bleiben auf diesem Gerät.";

        accountUsername.style.display = "none";
        accountPassword.style.display = "none";
        accountMainButton.style.display = "none";
        accountSwitchButton.style.display = "none";

        hint.textContent = "";

        return;

    }

    accountUsername.style.display = "";
    accountPassword.style.display = "";
    accountMainButton.style.display = "";
    accountSwitchButton.style.display = "";

    accountLoginMode = true;

    accountTitle.textContent =
        "Anmelden";

    accountDescription.textContent =
        "Melde dich mit deinem Benutzernamen und Passwort an.";

    accountMainButton.textContent =
        "Anmelden";

    accountSwitchButton.textContent =
        "Neues Konto erstellen";

    hint.textContent =
        "Als Gast bleiben deine Punkte nur auf diesem Gerät.";

}


accountSwitchButton.onclick =
function(){

    accountLoginMode =
        !accountLoginMode;

    if(accountLoginMode){

        accountTitle.textContent =
            "Anmelden";

        accountDescription.textContent =
            "Benutzername und Passwort eingeben.";

        accountMainButton.textContent =
            "Anmelden";

        accountSwitchButton.textContent =
            "Neues Konto erstellen";

    }else{

        accountTitle.textContent =
            "Konto erstellen";

        accountDescription.textContent =
            "Erstelle dein Kronix-Konto.";

        accountMainButton.textContent =
            "Konto erstellen";

        accountSwitchButton.textContent =
            "Ich habe bereits ein Konto";

    }

};


/* Benutzername → interne E-Mail-Adresse für Supabase Auth.
   Es wird KEINE echte E-Mail erhoben. */

function usernameToEmail(username){

    return username.toLowerCase() +
        "@spieler.kronix-timer.app";

}


function authErrorText(error){

    const message =
        String((error && error.message) || "");

    if(message.includes("already registered"))
        return "Dieser Benutzername ist bereits vergeben.";

    if(message.includes("Invalid login credentials"))
        return "Falscher Benutzername oder falsches Passwort.";

    if(message.includes("Password should be"))
        return "Das Passwort muss mindestens 6 Zeichen haben.";

    if(
        message.includes("fetch") ||
        message.includes("network") ||
        message.includes("Failed")
    )
        return "Keine Verbindung zum Server. Prüfe dein Internet.";

    return "Fehler: " + message;

}


accountMainButton.onclick =
async function(){

    if(!isOnline())return;

    const username =
        accountUsername.value.trim();

    const password =
        accountPassword.value;

    if(
        !/^[a-zA-Z0-9_]{3,20}$/.test(username)
    ){

        alert(
            "Der Benutzername muss 3 bis 20 Zeichen haben und darf nur Buchstaben, Zahlen und _ enthalten."
        );

        return;

    }

    if(password.length < 6){

        alert(
            "Das Passwort muss mindestens 6 Zeichen haben."
        );

        return;

    }

    accountMainButton.disabled = true;

    try{

        if(accountLoginMode){

            await loginAccount(
                username,
                password
            );

        }else{

            await createAccount(
                username,
                password
            );

        }

    }catch(error){

        alert(
            authErrorText(error)
        );

    }

    accountMainButton.disabled = false;

};


function startGuestMode(){

    isGuest = true;

    currentUser = null;
    currentUserId = null;

    currentProfile =
        getGuestProfile();

    localStorage.setItem(
        "kronixGuestActive",
        "1"
    );

    accountScreen.style.display =
        "none";

    updateRankingButton();

}


document.getElementById(
    "guestButton"
).onclick =
startGuestMode;


async function createAccount(username, password){

    const { data, error } =
        await supabaseClient.auth.signUp({

            email:
                usernameToEmail(username),

            password:
                password,

            options:{
                data:{ username: username }
            }

        });

    if(error)throw error;

    const { error: profileError } =
        await supabaseClient
            .from("profiles")
            .insert({
                id: data.user.id,
                username: username
            });

    if(profileError){

        if(
            String(profileError.message)
                .includes("duplicate")
        ){

            throw new Error(
                "Dieser Benutzername ist bereits vergeben."
            );

        }

        throw profileError;

    }

    finishLogin(
        username,
        data.user.id,
        emptyProfile()
    );

}


async function loginAccount(username, password){

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email:
                usernameToEmail(username),

            password:
                password

        });

    if(error)throw error;

    await loadProfile(data.user);

}


async function loadProfile(user){

    const { data, error } =
        await supabaseClient
            .from("profiles")
            .select("username,image,perfects,ranks")
            .eq("id", user.id)
            .maybeSingle();

    if(error)throw error;

    if(data){

        finishLogin(
            data.username,
            user.id,
            {
                image:
                    data.image || "",

                perfects:
                    data.perfects || 0,

                ranks:
                    data.ranks ||
                    emptyProfile().ranks
            }
        );

        return;

    }

    /* Profil fehlt (z.B. abgebrochene Registrierung)
       → still neu anlegen */

    const username =
        (
            user.user_metadata &&
            user.user_metadata.username
        ) ||
        "Spieler" + String(user.id).slice(0, 6);

    await supabaseClient
        .from("profiles")
        .insert({
            id: user.id,
            username: username
        });

    finishLogin(
        username,
        user.id,
        emptyProfile()
    );

}


function finishLogin(username, userId, profile){

    currentUser = username;
    currentUserId = userId;
    currentProfile = profile;
    isGuest = false;

    accountScreen.style.display =
        "none";

    updateRankingButton();

}


async function initAccount(){

    updateAccountScreen();

    /* War der Spieler zuletzt Gast?
       Dann direkt als Gast weiterspielen. */

    if(
        localStorage.getItem(
            "kronixGuestActive"
        ) === "1"
    ){

        startGuestMode();

        return;

    }

    if(!isOnline()){

        accountScreen.style.display =
            "flex";

        return;

    }

    try{

        const { data } =
            await supabaseClient.auth.getSession();

        if(
            data &&
            data.session
        ){

            await loadProfile(
                data.session.user
            );

            return;

        }

    }catch(error){

        /* Server nicht erreichbar →
           Anmeldebildschirm zeigen */

    }

    accountScreen.style.display =
        "flex";

}


function getCurrentAccount(){

    return currentProfile;

}


/* =====================================================
   PROFIL
===================================================== */

const profileButton =
    document.getElementById(
        "profileButton"
    );

        "deleteAccountButton"

            );

            return;

        await supabaseClient
            .auth.signOut();

        backToAccountScreen();

function escapeHTML(text){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        );

}

/* =====================================================
   ZEIT
===================================================== */

function formatTime(milliseconds){

    const seconds =
        Math.floor(
            milliseconds / 1000
        );

    const hundredths =
        Math.floor(
            (milliseconds % 1000) / 10
        );

    return String(seconds)
        .padStart(2,"0")
        + "."
        +
        String(hundredths)
        .padStart(2,"0");

}


/* =====================================================
   GENAUIGKEIT
===================================================== */

/*
   WICHTIG:
   Es zählt die Zeit, die der Spieler SIEHT.
   Der Timer zeigt nur Hundertstel an (01.00),
   also wird auch mit Hundertsteln gerechnet.
   Sonst zeigt der Bildschirm 1.00, aber die
   Genauigkeit ist trotzdem nicht 100 %.
*/

function shownTime(actual){

    return Math.floor(
        actual * 100 + 0.000001
    ) / 100;

}


function calculateAccuracy(
    actual,
    target
){

    if(target <= 0)
        return 0;

    const difference =
        Math.abs(
            shownTime(actual) - target
        );

    let accuracy =
        100 -
        (
            difference /
            target *
            100
        );

    accuracy =
        Math.max(
            0,
            accuracy
        );

    /*
       Immer auf 2 Nachkommastellen
       runden.
    */

    return Math.round(
        accuracy * 100
    ) / 100;

}


function accuracyText(
    accuracy
){

    return accuracy
        .toFixed(2)
        .replace(".",",")
        + " %";

}


/*
   Ein echter Treffer:
   Auf dem Bildschirm steht exakt die Zielzeit.
   (Gleiche Regel wie bei der Genauigkeit –
   Anzeige und Wertung passen immer zusammen.)
*/

function isPerfectTarget(
    actual,
    target
){

    return Math.abs(
        shownTime(actual) - target
    ) < 0.005;

}

const rankingNames = {

    challenge:
        "🎯 Challenge",

    challengeBlind:
        "🎯🕶️ Challenge Blind",

    oneSecond:
        "🎯 Stoppe bei 1 Sekunde",

    fiveSecond:
        "🎯 Stoppe bei 5 Sekunden",

    tenSecond:
        "🎯 Stoppe bei 10 Sekunden"

};


function rankingAllowed(){

    return Object.prototype.hasOwnProperty.call(
        rankingNames,
        currentMode
    );

}


function updateRankingButton(){

    if(!rankingAllowed()){

        rankingButton.style.display =
            "none";

        return;

    }

    rankingButton.style.display =
        "block";

    const account =
        getCurrentAccount();

    const score =
        account &&
        account.ranks
        ? account.ranks[currentMode] || 0
        : 0;

    rankingButton.textContent =
        "🏆 " + score;

}


function addPerfect(){

    const profile =
        getCurrentAccount();

    if(!profile)return;

    profile.perfects =
        Number(
            profile.perfects || 0
        ) + 1;

    if(rankingAllowed()){

        if(!profile.ranks)
            profile.ranks =
                emptyProfile().ranks;

        profile.ranks[currentMode] =
            Number(
                profile.ranks[currentMode] || 0
            ) + 1;

    }

    if(isGuest){

        saveGuestProfile(profile);

    }else if(
        isOnline() &&
        rankingAllowed()
    ){

        /* Der Server zählt selbst mit und prüft,
           ob der Treffer plausibel ist. Seine
           Antwort ist die Wahrheit. */

        supabaseClient
            .rpc("add_perfect", {
                mode: currentMode
            })
            .then(
                function(result){

                    if(
                        result.data &&
                        currentProfile &&
                        !isGuest
                    ){

                        currentProfile.ranks =
                            result.data;

                    }

                    updateRankingButton();

                }
            );

    }

    updateRankingButton();

}

async function showGlobalRanking(){

    /* OFFLINE: nur die eigenen Punkte
       auf diesem Gerät */

    if(!isOnline()){

        const profile =
            getCurrentAccount();

        const score =
            profile &&
            profile.ranks
            ? Number(
                profile.ranks[currentMode] || 0
            )
            : 0;

        renderRankingPanel(
            "Rangliste auf diesem Gerät (offline)",
            score > 0
            ? rankingRowsHTML([{
                username:
                    currentUser || "Gast",
                image:
                    profile.image,
                score:
                    score
            }])
            : "",
            ""
        );

        return;

    }

    /* ONLINE: globale Rangliste vom Server */

    panelTitle.textContent =
        "🏆 " +
        rankingNames[currentMode];

    panelContent.innerHTML =
        "<p>Lädt...</p>";

    panel.classList.add(
        "open"
    );

    const { data, error } =
        await supabaseClient
            .from("profiles")
            .select("username,image,ranks")
            .limit(500);

    if(error){

        renderRankingPanel(
            "🌐 Globale Rangliste",
            "<p>Rangliste konnte nicht geladen werden. Prüfe dein Internet.</p>",
            ""
        );

        return;

    }

    const players =
        (data || [])

        .map(
            function(row){

                return {

                    username:
                        row.username,

                    image:
                        row.image,

                    score:
                        row.ranks
                        ? Number(
                            row.ranks[currentMode] || 0
                        )
                        : 0

                };

            }
        )

        .filter(
            player =>
                player.score > 0
        )

        .sort(
            (a, b) =>
                b.score -
                a.score
        )

        .slice(0, 50);

    renderRankingPanel(
        "🌐 Globale Rangliste – 100%-Erfolge in diesem Modus",
        rankingRowsHTML(players),
        isGuest
        ? "Als Gast erscheinst du nicht in der Liste."
        : ""
    );

}

/* =====================================================
   KONFETTI
===================================================== */

function startConfetti(){

    const canvas =
        confettiCanvas;

    const ctx =
        canvas.getContext(
            "2d"
        );

    canvas.width =
        innerWidth;

    canvas.height =
        innerHeight;

    const colors = [

        "#00aaff",
        "#ffffff",
        "#0055ff",
        "#66ccff"

    ];

    const pieces = [];

    for(
        let i = 0;
        i < 150;
        i++
    ){

        pieces.push({

            x:
                innerWidth / 2,

            y:
                innerHeight / 2,

            vx:
                (Math.random() - .5) * 16,

            vy:
                (Math.random() - .8) * 16,

            size:
                Math.random() * 8 + 4,

            rotation:
                Math.random() * 360,

            rotationSpeed:
                (Math.random() - .5) * 16,

            life:
                1,

            color:
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ]

        });

    }

    function draw(){

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        let alive =
            false;

        pieces.forEach(
            function(piece){

                if(
                    piece.life <= 0
                )
                    return;

                alive =
                    true;

                piece.x +=
                    piece.vx;

                piece.y +=
                    piece.vy;

                piece.vy +=
                    .35;

                piece.rotation +=
                    piece.rotationSpeed;

                piece.life -=
                    .012;

                ctx.save();

                ctx.globalAlpha =
                    Math.max(
                        0,
                        piece.life
                    );

                ctx.translate(
                    piece.x,
                    piece.y
                );

                ctx.rotate(
                    piece.rotation *
                    Math.PI /
                    180
                );

                ctx.fillStyle =
                    piece.color;

                ctx.fillRect(
                    -piece.size / 2,
                    -piece.size / 2,
                    piece.size,
                    piece.size * 1.8
                );

                ctx.restore();

            }
        );

        if(alive){

            requestAnimationFrame(
                draw
            );

        }

    }

    draw();

}


/* =====================================================
   TIMER
===================================================== */

function updateTimer(){

    if(!running)
        return;

    elapsedTime =
        performance.now() -
        startTime;

    if(
        currentMode === "blind" ||
        currentMode === "challengeBlind"
    ){

        timer.textContent =
            "???";

    }else{

        timer.textContent =
            formatTime(
                elapsedTime
            );

    }

    animationFrame =
        requestAnimationFrame(
            updateTimer
        );

}

    ){

/* =====================================================
   SPIEL
===================================================== */

gameArea.addEventListener(
    "pointerup",
    function(event){

        event.preventDefault();

        handleGameTap();

    }
);


function handleGameTap(){

    /*
       Ergebnis anklicken =
       neue Runde.
    */

    if(resultVisible){

        createNewTarget();

        return;

    }


    /*
       START
    */

    if(!running){

        startTime =
            performance.now();

        elapsedTime =
            0;

        running =
            true;


        if(
            currentMode ===
            "normal"
        ){

            info.textContent =
                "Tippe zum Stoppen";

        }


        if(
            currentMode ===
            "blind"
        ){

            info.textContent =
                "🕶️ Stoppe nach Gefühl";

        }


        if(
            currentMode ===
            "challenge"
        ){

            info.textContent =
                "🎯 Stoppe genau bei " +
                challengeTarget.toFixed(2) +
                " Sekunden";

        }


        if(
            currentMode ===
            "challengeBlind"
        ){

            info.textContent =
                "🎯🕶️ Stoppe nach Gefühl";

        }


        if(
            currentMode === "oneSecond" ||
            currentMode === "fiveSecond" ||
            currentMode === "tenSecond"
        ){

            info.textContent =
                "🎯 Stoppe genau bei " +
                challengeTarget.toFixed(2) +
                " Sekunden";

        }


        if(
            currentMode ===
            "friends"
        ){

            info.textContent =
                friends[currentFriend].name +
                " – Versuch " +
                (currentAttempt + 1) +
                " von " +
                friendAttempts;

        }

        updateTimer();

        return;

    }


    /*
       STOP
    */

    running =
        false;

    cancelAnimationFrame(
        animationFrame
    );

    elapsedTime =
        performance.now() -
        startTime;

    const actual =
        elapsedTime / 1000;


    if(
        currentMode === "normal" ||
        currentMode === "blind"
    ){

        timer.textContent =
            formatTime(
                elapsedTime
            );

        info.textContent =
            "Gestoppt bei " +
            formatTime(
                elapsedTime
            );

        return;

    }


    if(
        currentMode === "challenge" ||
        currentMode === "challengeBlind" ||
        currentMode === "oneSecond" ||
        currentMode === "fiveSecond" ||
        currentMode === "tenSecond"
    ){

        finishTarget(
            actual
        );

        return;

    }


    if(
        currentMode ===
        "friends"
    ){

        finishFriendAttempt();

    }

}


/* =====================================================
   ZIEL-MODI AUSWERTEN
===================================================== */

function finishTarget(
    actual
){

    const accuracy =
        calculateAccuracy(
            actual,
            challengeTarget
        );

    timer.textContent =
        formatTime(
            elapsedTime
        );


    if(
        isPerfectTarget(
            actual,
            challengeTarget
        )
    ){

        info.textContent =
            "🔥 PERFEKT! 100%";

        celebratePerfect();

    }else{

        info.textContent =
            "Gestoppt bei " +
            formatTime(
                elapsedTime
            ) +
            " – " +
            accuracyText(
                accuracy
            ) +
            " Genauigkeit";

    }


    resultVisible =
        true;


    resultTimer =
        setTimeout(
            function(){

                if(
                    !running &&
                    resultVisible
                ){

                    timer.textContent =
                        accuracyText(
                            accuracy
                        );

                    info.textContent =
                        "🎯 Genauigkeit";

                }

            },
            2000
        );

}

/* =====================================================
   MODUS WECHSEL
===================================================== */

function changeMode(
    newMode
){

    running =
        false;

    cancelAnimationFrame(
        animationFrame
    );

    clearTimeout(
        resultTimer
    );

    elapsedTime =
        0;

    resultVisible =
        false;

    currentMode =
        newMode;

    panel.classList.remove(
        "open"
    );

    modeMenu.classList.remove(
        "open"
    );


    const names = {

        normal:
            "Normalmodus",

        blind:
            "Blindmodus",

        challenge:
            "Challenge",

        challengeBlind:
            "Challenge Blind",

        oneSecond:
            "Stoppe bei 1,00",

        fiveSecond:
            "Stoppe bei 5,00",

        tenSecond:
            "Stoppe bei 10,00",

        friends:
            "Freunde"

    };


    modeButton.textContent =
        names[newMode] +
        " ▾";


    updateRankingButton();


    if(
        newMode === "challenge" ||
        newMode === "challengeBlind" ||
        newMode === "oneSecond" ||
        newMode === "fiveSecond" ||
        newMode === "tenSecond"
    ){

        createNewTarget();

        return;

    }


    timer.textContent =
        "00.00";


    if(
        newMode ===
        "blind"
    ){

        info.textContent =
            "🕶️ Blindmodus";

    }else if(
        newMode ===
        "friends"
    ){

        info.textContent =
            "👥 Freunde-Modus";

        openFriendsSetup();

    }else{

        info.textContent =
            "Tippe oder klicke zum Starten";

    }

}

    };


    document.getElementById(
        "startFriendsButton"
    ).onclick =
    function(){

        const name =
            document.getElementById(
                "firstFriendName"
            ).value.trim();

        const count =
            Number(
                document.getElementById(
                    "friendAttemptInput"
                ).value
            );

        const target =
            Number(
                document.getElementById(
                    "friendTargetInput"
                ).value
            );


        if(
            !name ||
            count < 1 ||
            target <= 0
        ){

            return;

        }


        friends = [

            {
                name:name,
                scores:[],
                average:0
            }

        ];


        currentFriend =
            0;

        friendAttempts =
            count;

        currentAttempt =
            0;

        friendTarget =
            target;

        friendScores =
            [];


        panel.classList.remove(
            "open"
        );


        timer.textContent =
            "00.00";

        info.textContent =
            name +
            " ist bereit – Ziel " +
            target.toFixed(2) +
            " Sekunden";

    };

}


function finishFriendAttempt(){

    const actual =
        elapsedTime / 1000;

    const accuracy =
        calculateAccuracy(
            actual,
            friendTarget
        );


    friendScores.push(
        accuracy
    );

    currentAttempt++;


    timer.textContent =
        formatTime(
            elapsedTime
        );


    if(
        isPerfectTarget(
            actual,
            friendTarget
        )
    ){

        info.textContent =
            "🔥 PERFEKT! 100%";

    }else{

        info.textContent =
            accuracyText(
                accuracy
            ) +
            " Genauigkeit";

    }


    if(
        currentAttempt >=
        friendAttempts
    ){

        const average =
            Math.round(
                (
                    friendScores.reduce(
                        (sum,value) =>
                            sum + value,
                        0
                    ) /
                    friendScores.length
                ) * 100
            ) / 100;


        friends[currentFriend].scores =
            friendScores.slice();

        friends[currentFriend].average =
            average;


        setTimeout(
            showFriendResult,
            500
        );

    }

}


function showFriendResult(){

    const player =
        friends[currentFriend];


    panelTitle.textContent =
        "🏆 Ergebnis";


    panelContent.innerHTML = `

        <h2>
            ${escapeHTML(
                player.name
            )}
        </h2>

        <p>
            Durchschnittliche Genauigkeit:
        </p>

        <h1>
            ${accuracyText(
                player.average
            )}
        </h1>

        <button
            class="panelButton"
            id="nextFriend">
            Nächster Spieler
        </button>

        <button
            class="panelButton secondary"
            id="closeFriendResult">
            Schließen
        </button>

    `;


    panel.classList.add(
        "open"
    );


    document.getElementById(
        "nextFriend"
    ).onclick =
    addNextFriend;


    document.getElementById(
        "closeFriendResult"
    ).onclick =
    function(){

        panel.classList.remove(
            "open"
        );

    };

}


function addNextFriend(){

    panelTitle.textContent =
        "👥 Nächster Spieler";


    panelContent.innerHTML = `

        <p>
            Name eingeben:
        </p>

        <input
            id="nextFriendName"
            placeholder="Name">

        <button
            class="panelButton"
            id="addNextFriendButton">
            Spieler hinzufügen
        </button>

    `;


    document.getElementById(
        "addNextFriendButton"
    ).onclick =
    function(){

        const name =
            document.getElementById(
                "nextFriendName"
            ).value.trim();


        if(!name)
            return;


        friends.push({

            name:name,
            scores:[],
            average:0

        });


        currentFriend =
            friends.length - 1;

        currentAttempt =
            0;

        friendScores =
            [];


        panel.classList.remove(
            "open"
        );


        timer.textContent =
            "00.00";

        info.textContent =
            name +
            " ist bereit!";

    };

}

function applyDesign(){

    const d =
        designs[currentDesign];


    document.body.style.background =
        d.background;

    gameArea.style.background =
        d.background;

    timer.style.color =
        d.timer;

    modeButton.style.background =
        d.button;

    designButton.style.background =
        d.button;

    profileButton.style.background =
        d.button;

    rankingButton.style.background =
        d.button;

    info.style.color =
        d.info;


    timer.style.textShadow =
        neonEnabled

        ?

        "0 0 8px " +
        d.timer +
        ",0 0 20px " +
        d.timer +
        ",0 0 40px " +
        d.timer

        :

        "none";


    document
    .querySelectorAll(
        ".designChoice"
    )
    .forEach(
        function(button){

            button.classList.toggle(
                "active",
                button.dataset.design ===
                currentDesign
            );

        }
    );

}


document
.querySelectorAll(
    ".designChoice"
)
.forEach(
    function(button){

        button.addEventListener(
            "pointerup",
            function(e){

                e.preventDefault();

                e.stopPropagation();

                    button.dataset.design;

                applyDesign();

        );

    }
);

            neonEnabled

            "✨ Neon: EIN"

/* =====================================================
   KRONIX LADEBILDSCHIRM
===================================================== */

let kronixProgress =
    0;

const kronixPercent =
    document.getElementById(
        "kronix-percent"
    );

const kronixLoading =
    document.getElementById(
        "kronix-loading"
    );


const kronixInterval =
    setInterval(
        function(){

            kronixProgress +=
                1;


            if(
                kronixProgress >=
                100
            ){

                kronixProgress =
                    100;

                clearInterval(
                    kronixInterval
                );


                setTimeout(
                    function(){

                        kronixLoading.style.transition =
                            "opacity .6s";

                        kronixLoading.style.opacity =
                            "0";


                        setTimeout(
                            function(){

                                kronixLoading.remove();

                            },
                            600
                        );

                    },
                    300
                );

            }


            kronixPercent.textContent =
                kronixProgress;

        },
        35
    );

</script>
