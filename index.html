const SUPABASE_URL =
    "https://ygdgqpedwdpbxlicviks.supabase.co";

const SUPABASE_ANON_KEY =

/* Gast-Punkte bleiben nur auf diesem Gerät */

function getGuestProfile(){

    try{

        return Object.assign(
            emptyProfile(),
            JSON.parse(
                localStorage.getItem(
                    "kronixGuest"
                ) || "{}"
            )
        );

    }catch{

        return emptyProfile();

    }
}


function saveGuestProfile(profile){

    localStorage.setItem(
        "kronixGuest",
        JSON.stringify(profile)
    );

}


/* Profilbild vor dem Speichern verkleinern,
   damit es nicht riesig wird */

function resizeImage(dataUrl, size, callback){

    const img = new Image();

    img.onload = function(){

        const canvas =
            document.createElement("canvas");

        canvas.width = size;
        canvas.height = size;

        const ctx =
            canvas.getContext("2d");

        const min =
            Math.min(img.width, img.height);

        ctx.drawImage(
            img,
            (img.width - min) / 2,
            (img.height - min) / 2,
            min,
            min,
            0,
            0,
            size,
            size
        );

        callback(
            canvas.toDataURL("image/jpeg", 0.8)
        );

    };

    img.src = dataUrl;

}

function authErrorText(error){

    const message =
        String((error && error.message) || "");

    if(message.includes("already registered"))
        return "Dieser Benutzername ist bereits vergeben.";

    if(message.includes("Invalid login credentials"))
        return "Falscher Benutzername oder falsches Passwort.";

    if(message.includes("Password should be"))
        return "Das Passwort muss mindestens 6 Zeichen haben.";

    if(
        message.includes("fetch") ||
        message.includes("network") ||
        message.includes("Failed")
    )
        return "Keine Verbindung zum Server. Prüfe dein Internet.";

    return "Fehler: " + message;

}

async function createAccount(username, password){

    const { data, error } =
        await supabaseClient.auth.signUp({

            email:
                usernameToEmail(username),

            password:
                password,

            options:{
                data:{ username: username }
            }

        });

    if(error)throw error;

    const { error: profileError } =
        await supabaseClient
            .from("profiles")
            .insert({
                id: data.user.id,
                username: username
            });

    if(profileError){

        if(
            String(profileError.message)
                .includes("duplicate")
        ){

            throw new Error(
                "Dieser Benutzername ist bereits vergeben."
            );

        }

        throw profileError;

    }

    finishLogin(
        username,
        data.user.id,
        emptyProfile()
    );

}


async function loginAccount(username, password){

    const { data, error } =
        await supabaseClient.auth.signInWithPassword({

            email:
                usernameToEmail(username),

            password:
                password

        });

    if(error)throw error;

    await loadProfile(data.user);

}


async function loadProfile(user){

    const { data, error } =
        await supabaseClient
            .from("profiles")
            .select("username,image,perfects,ranks")
            .eq("id", user.id)
            .maybeSingle();

    if(error)throw error;

    if(data){

        finishLogin(
            data.username,
            user.id,
            {
                image:
                    data.image || "",

                perfects:
                    data.perfects || 0,

                ranks:
                    data.ranks ||
                    emptyProfile().ranks
            }
        );

        return;

    }

    /* Profil fehlt (z.B. abgebrochene Registrierung)
       → still neu anlegen */

    const username =
        (
            user.user_metadata &&
            user.user_metadata.username
        ) ||
        "Spieler" + String(user.id).slice(0, 6);

    await supabaseClient
        .from("profiles")
        .insert({
            id: user.id,
            username: username
        });

    finishLogin(
        username,
        user.id,
        emptyProfile()
    );

}

/* =====================================================
   SOUND (Web Audio, keine Dateien noetig)
===================================================== */

let soundEnabled =
    localStorage.getItem("kronixSound") !== "0";

let audioContext =
    null;

function playTone(frequency, duration, type, volume, delay){

    if(!soundEnabled)return;

    try{

        if(!audioContext){

            audioContext =
                new (window.AudioContext ||
                     window.webkitAudioContext)();

        }

        const t0 =
            audioContext.currentTime +
            (delay || 0);

        const osc =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        osc.type =
            type || "sine";

        osc.frequency.value =
            frequency;

        gain.gain.setValueAtTime(
            volume || 0.12,
            t0
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            t0 + duration
        );

        osc.connect(gain);
        gain.connect(audioContext.destination);

        osc.start(t0);
        osc.stop(t0 + duration);

    }catch(error){

        /* Ohne Sound geht das Spiel normal weiter */

    }
}

function soundStart(){ playTone(440, 0.08, "sine", 0.08); }

function soundGo(){ playTone(880, 0.12, "square", 0.1); }
function soundFail(){ playTone(140, 0.25, "sawtooth", 0.12); }

    playTone(660, 0.12, "sine", 0.12);
    playTone(880, 0.12, "sine", 0.12, 0.09);

/* =====================================================
   ZEIT
===================================================== */

function formatTime(milliseconds){

    const seconds =
        Math.floor(
            milliseconds / 1000
        );

    const hundredths =
        Math.floor(
            (milliseconds % 1000) / 10
        );

    return String(seconds)
        .padStart(2,"0")
        + "."
        +
        String(hundredths)
        .padStart(2,"0");

}


/* =====================================================
   GENAUIGKEIT
===================================================== */

/*
   WICHTIG:
   Es zählt die Zeit, die der Spieler SIEHT.
   Der Timer zeigt nur Hundertstel an (01.00),
   also wird auch mit Hundertsteln gerechnet.
   Sonst zeigt der Bildschirm 1.00, aber die
   Genauigkeit ist trotzdem nicht 100 %.
*/

function shownTime(actual){

    return Math.floor(
        actual * 100 + 0.000001
    ) / 100;

}


function calculateAccuracy(
    actual,
    target
){

    if(target <= 0)
        return 0;

    const difference =
        Math.abs(
            shownTime(actual) - target
        );

    let accuracy =
        100 -
        (
            difference /
            target *
            100
        );

    accuracy =
        Math.max(
            0,
            accuracy
        );

    /*
       Immer auf 2 Nachkommastellen
       runden.
    */

    return Math.round(
        accuracy * 100
    ) / 100;

}


function accuracyText(
    accuracy
){

    return accuracy
        .toFixed(2)
        .replace(".",",")
        + " %";

}


/*
   Ein echter Treffer:
   Auf dem Bildschirm steht exakt die Zielzeit.
   (Gleiche Regel wie bei der Genauigkeit –
   Anzeige und Wertung passen immer zusammen.)
*/

function isPerfectTarget(
    actual,
    target
){

    return Math.abs(
        shownTime(actual) - target
    ) < 0.005;

}

/* Anzeige des Punktestands je Modus:
   Treffer-Modi zaehlen 100%-Erfolge,
   Reaktion = beste Zeit, Survival = beste Runde */

function scoreLabel(mode, score){

    if(mode === "reaction"){

        return score > 0
            ? "⚡ " + score + " ms"
            : "⚡ –";

    }

    if(mode === "survival"){

        return "🔥 " + score;

    }

    return "🏆 " + score;

}


function rankingAllowed(){

    return Object.prototype.hasOwnProperty.call(
        rankingNames,

    );

        rankingButton.style.display =
            "none";

    rankingButton.style.display =

        getCurrentAccount();

    const score =
        account &&
        account.ranks
        ? account.ranks[currentMode] || 0
        : 0;

    rankingButton.textContent =
        scoreLabel(
            currentMode,
            Number(score)
        );

}


function addPerfect(){

    const profile =
        getCurrentAccount();

    if(!profile)return;

    profile.perfects =
        Number(
            profile.perfects || 0
        ) + 1;

    if(rankingAllowed()){

        if(!profile.ranks)
            profile.ranks =
                emptyProfile().ranks;

        profile.ranks[currentMode] =
            Number(
                profile.ranks[currentMode] || 0
            ) + 1;

    }

    if(isGuest){

        saveGuestProfile(profile);

    }else if(
        isOnline() &&
        rankingAllowed()
    ){

        /* Der Server zählt selbst mit und prüft,
           ob der Treffer plausibel ist. Seine
           Antwort ist die Wahrheit. */

        supabaseClient
            .rpc("add_perfect", {
                mode: currentMode
            })
            .then(
                function(result){

                    if(
                        result.data &&
                        currentProfile &&
                        !isGuest
                    ){

                        currentProfile.ranks =
                            result.data;

                    }

                    updateRankingButton();

                }
            );

    }

    updateRankingButton();

}


/* Bestwert melden (Reaktion: niedriger ist besser,
   Survival: hoeher ist besser). Der Server prueft
   die Plausibilitaet und speichert nur echte Rekorde. */

function submitBest(mode, value){

    const profile =
        getCurrentAccount();

    if(!profile)return;

    if(!profile.ranks)
        profile.ranks =
            emptyProfile().ranks;

    const current =
        Number(profile.ranks[mode] || 0);

    const better =
        mode === "reaction"
        ? (current === 0 || value < current)
        : value > current;

    if(!better){

        updateRankingButton();

        return;

    }

    profile.ranks[mode] =
        value;

    if(isGuest){

        saveGuestProfile(profile);

    }else if(isOnline()){

        supabaseClient
            .rpc("submit_best", {
                mode: mode,
                value: value
            })
            .then(
                function(result){

                    if(
                        result.data &&
                        currentProfile &&
                        !isGuest
                    ){

                        currentProfile.ranks =
                            result.data;

                    }

                    updateRankingButton();

                }
            );

    }

    updateRankingButton();

}

            rotation:
                Math.random() * 360,

            rotationSpeed:
                (Math.random() - .5) * 16,

            life:
                1,

            color:
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ]

        });

    }

    function draw(){

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        let alive =
            false;

        pieces.forEach(
            function(piece){

                if(
                    piece.life <= 0
                )
                    return;

                alive =
                    true;

                piece.x +=
                    piece.vx;

                piece.y +=
                    piece.vy;

                piece.vy +=
                    .35;

                piece.rotation +=
                    piece.rotationSpeed;

                piece.life -=
                    .012;

                ctx.save();

                ctx.globalAlpha =
                    Math.max(
                        0,
                        piece.life
                    );

                ctx.translate(
                    piece.x,
                    piece.y
                );

                ctx.rotate(
                    piece.rotation *
                    Math.PI /
                    180
                );

                ctx.fillStyle =
                    piece.color;

                ctx.fillRect(
                    -piece.size / 2,
                    -piece.size / 2,
                    piece.size,
                    piece.size * 1.8
                );

                ctx.restore();

            }
        );

        if(alive){

            requestAnimationFrame(
                draw
            );

        }

    }

    draw();

}

function handleGameTap(){

    /*
       Reaktionstest hat eine
       eigene Steuerung.
    */

    if(currentMode === "reaction"){

        handleReactionTap();

        return;

    }

    /*
       Ergebnis anklicken =
       neue Runde.
    */

    if(resultVisible){

        if(currentMode === "survival"){

            createSurvivalTarget();

        }else{

            createNewTarget();

        }

        /*
           Direkt wieder loslaufen —
           kein extra Tipp noetig,
           in ALLEN Modi.
        */

        startRun();

        return;

    }


    /*
       START
    */

    if(!running){

        startRun();

        return;

    }


    function startRun(){

        startTime =
            performance.now();

        elapsedTime =
            0;

        running =
            true;

        soundStart();

        timer.classList.add(
            "running"
        );


        if(
            currentMode ===
            "normal"
        ){

            info.textContent =
                "Tippe zum Stoppen";

        }


        if(
            currentMode ===
            "blind"
        ){

            info.textContent =
                "🕶️ Stoppe nach Gefühl";

        }


        if(
            currentMode ===
            "challenge"
        ){

            info.textContent =
                "🎯 Stoppe genau bei " +
                challengeTarget.toFixed(2) +
                " Sekunden";

        }


        if(
            currentMode ===
            "challengeBlind"
        ){

            info.textContent =
                "🎯🕶️ Stoppe bei " +
                challengeTarget.toFixed(2) +
                " – Timer versteckt";

        }


        if(
            currentMode === "oneSecond" ||
            currentMode === "fiveSecond" ||
            currentMode === "tenSecond"
        ){

            info.textContent =
                "🎯 Stoppe genau bei " +
                challengeTarget.toFixed(2) +
                " Sekunden";

        }


        if(
            currentMode ===
            "survival"
        ){

            info.textContent =
                "🔥 Stoppe bei " +
                challengeTarget.toFixed(2) +
                " (±" +
                survivalTolerance.toFixed(2) +
                ")";

        }


        if(
            currentMode ===
            "friends"
        ){

            info.textContent =
                friends[currentFriend].name +
                " – Versuch " +
                (currentAttempt + 1) +
                " von " +
                friendAttempts;

        }

        updateTimer();

        return;

    }


    /*
       STOP
    */

    running =
        false;

    soundStop();

    timer.classList.remove(
        "running"
    );

    cancelAnimationFrame(
        animationFrame
    );

    elapsedTime =
        performance.now() -
        startTime;

    const actual =
        elapsedTime / 1000;


    if(
        currentMode === "normal" ||
        currentMode === "blind"
    ){

        timer.textContent =
            formatTime(
                elapsedTime
            );

        info.textContent =
            "Gestoppt bei " +
            formatTime(
                elapsedTime
            );

        return;

    }


    if(
        currentMode === "challenge" ||
        currentMode === "challengeBlind" ||
        currentMode === "oneSecond" ||
        currentMode === "fiveSecond" ||
        currentMode === "tenSecond"
    ){

        finishTarget(
            actual
        );

        return;

    }


    if(
        currentMode ===
        "survival"
    ){

        finishSurvival(
            actual
        );

        return;

    }


    if(
        currentMode ===
        "friends"
    ){

        finishFriendAttempt();

    }

}


/* =====================================================
   SURVIVAL
   Ziel treffen, jede Runde wird die Toleranz
   kleiner. Ein Fehlschlag beendet den Lauf.
===================================================== */

function createSurvivalTarget(){

    clearTimeout(
        resultTimer
    );

    resultVisible =
        false;

    challengeTarget =
        Math.round(
            (
                Math.random() *
                6 +
                1
            ) * 100
        ) / 100;

    timer.textContent =
        challengeTarget.toFixed(2);

    info.textContent =
        "🔥 Runde " +
        (survivalRound + 1) +
        " – Ziel " +
        challengeTarget.toFixed(2) +
        " s (±" +
        survivalTolerance.toFixed(2) +
        ")";

}


function finishSurvival(actual){

    const difference =
        Math.abs(
            shownTime(actual) -
            challengeTarget
        );

    timer.textContent =
        formatTime(
            elapsedTime
        );

    resultVisible =
        true;

    if(
        difference <=
        survivalTolerance + 0.000001
    ){

        survivalRound++;

        survivalTolerance =
            Math.max(
                0.01,
                Math.round(
                    survivalTolerance *
                    0.85 *
                    100
                ) / 100
            );

        info.textContent =
            "✅ Runde " +
            survivalRound +
            " geschafft! Tippe für Runde " +
            (survivalRound + 1);

        if(difference < 0.005){

            celebratePerfectAnimation();

        }

    }else{

        const runden =
            survivalRound;

        soundFail();

        flashScreen("#dc2626");

        submitBest(
            "survival",
            runden
        );

        const account =
            getCurrentAccount();

        const rekord =
            account &&
            account.ranks
            ? Number(
                account.ranks.survival || 0
            )
            : 0;

        info.textContent =
            "💀 Daneben! " +
            (
                runden === 1
                ? "1 Runde überlebt"
                : runden + " Runden überlebt"
            ) +
            (
                rekord > 0
                ? " – Rekord: " + rekord
                : ""
            );

        survivalRound =
            0;

        survivalTolerance =
            0.15;

    }

}


/* =====================================================
   REAKTIONSTEST
   Warten auf GO, dann so schnell wie
   moeglich tippen. Beste Zeit zaehlt.
===================================================== */

function resetReaction(){

    clearTimeout(
        reactionTimeout
    );

    reactionState =
        "idle";

    timer.textContent =
        "⚡";

    info.textContent =
        "⚡ Tippe zum Starten – dann warte auf GO!";

}


function handleReactionTap(){

    /* Start: scharf stellen */

    if(
        reactionState === "idle" ||
        reactionState === "result"
    ){

        reactionState =
            "armed";

        timer.textContent =
            "•••";

        info.textContent =
            "Warte auf GO ...";

        const delay =
            1200 +
            Math.random() * 2300;

        reactionTimeout =
            setTimeout(
                function(){

                    reactionState =
                        "go";

                    reactionStart =
                        performance.now();

                    timer.textContent =
                        "GO!";

                    info.textContent =
                        "JETZT TIPPEN!";

                    soundGo();

                    flashScreen("#22c55e");

                },
                delay
            );

        return;

    }

    /* Zu frueh getippt */

    if(reactionState === "armed"){

        clearTimeout(
            reactionTimeout
        );

        reactionState =
            "result";

        timer.textContent =
            "✖";

        info.textContent =
            "Zu früh! Tippe für einen neuen Versuch";

        soundFail();

        flashScreen("#dc2626");

        return;

    }

    /* Reaktion messen */

    if(reactionState === "go"){

        const ms =
            Math.round(
                performance.now() -
                reactionStart
            );

        reactionState =
            "result";

        timer.textContent =
            ms + " ms";

        let bewertung;

        if(ms < 10){

            bewertung =
                "👑 REAKTIONSKÖNIG!";

            celebratePerfectAnimation();

        }else if(ms < 50){

            bewertung =
                "🚀 Ultraschnell!";

            celebratePerfectAnimation();

        }else if(ms < 100){

            bewertung =
                "⚡ Sehr schnell!";

            celebratePerfectAnimation();

        }else if(ms < 200){

            bewertung =
                "💨 Schnell!";

        }else if(ms < 300){

            bewertung =
                "👍 Normal";

        }else{

            bewertung =
                "🐢 Langsam";

        }

        submitBest(
            "reaction",
            ms
        );

        const account =
            getCurrentAccount();

        const rekord =
            account &&
            account.ranks
            ? Number(
                account.ranks.reaction || 0
            )
            : 0;

        info.textContent =
            bewertung +
            (
                rekord > 0
                ? " – Rekord: " + rekord + " ms"
                : ""
            ) +
            " – tippe für neuen Versuch";

    }

}

    if(

    ){

        survivalRound =
            0;

        survivalTolerance =
            0.15;

        createSurvivalTarget();

        return;

    }


    if(
        newMode === "challenge" ||
        newMode === "challengeBlind" ||
        newMode === "oneSecond" ||
        newMode === "fiveSecond" ||
        newMode === "tenSecond"
    ){

        createNewTarget();

        return;

    }


    timer.textContent =
        "00.00";


    if(
        newMode ===
        "blind"
    ){

        info.textContent =
            "🕶️ Blindmodus";

    }else if(
        newMode ===
        "friends"
    ){

        info.textContent =
            "👥 Freunde-Modus";

        openFriendsSetup();

function finishFriendAttempt(){

    const actual =
        elapsedTime / 1000;

    const accuracy =
        calculateAccuracy(
            actual,
            friendTarget
        );


    friendScores.push(
        accuracy
    );

    currentAttempt++;


    timer.textContent =
        formatTime(
            elapsedTime
        );


    if(
        isPerfectTarget(
            actual,
            friendTarget
        )
    ){

        info.textContent =
            "🔥 PERFEKT! 100%";

    }else{

        info.textContent =
            accuracyText(
                accuracy
            ) +
            " Genauigkeit";

    }


    if(
        currentAttempt >=
        friendAttempts
    ){

        const average =
            Math.round(
                (
                    friendScores.reduce(
                        (sum,value) =>
                            sum + value,
                        0
                    ) /
                    friendScores.length
                ) * 100
            ) / 100;


        friends[currentFriend].scores =
            friendScores.slice();

        friends[currentFriend].average =
            average;


        setTimeout(
            showFriendResult,
            500
        );

    }

}

/* =====================================================
   HERAUSFORDERN (TEILEN)
   Der wichtigste Knopf, um beruehmt zu werden:
   Spieler laden Spieler ein.
===================================================== */

const shareButton =
    document.getElementById(
        "shareButton"
    );

function buildShareText(){

    const account =
        getCurrentAccount();

    const ranks =
        account && account.ranks
        ? account.ranks
        : emptyProfile().ranks;

    if(
        currentMode === "reaction" &&
        Number(ranks.reaction) > 0
    ){

        return "⚡ Meine Reaktionszeit in Timer Challenge: " +
            ranks.reaction +
            " ms – schlag mich!";

    }

    if(
        currentMode === "survival" &&
        Number(ranks.survival) > 0
    ){

        return "🔥 Ich habe " +
            ranks.survival +
            " Survival-Runden in Timer Challenge überlebt – schaffst du mehr?";

    }

    const score =
        Number(ranks[currentMode] || 0);

    if(
        rankingAllowed() &&
        score > 0
    ){

        return "🏆 " +
            score +
            " perfekte Treffer in Timer Challenge – kannst du das toppen?";

    }

    return "⏱️ Timer Challenge – stoppe den Timer auf die exakte Zeit. Trau dich!";

}

shareButton.addEventListener(
    "pointerup",
    function(e){

        e.preventDefault();

        e.stopPropagation();

        const text =
            buildShareText();

        const url =
            "https://ibralox37.github.io/Timer-/";

        if(navigator.share){

            navigator.share({
                title: "Timer Challenge",
                text: text,
                url: url
            }).catch(function(){});

        }else if(navigator.clipboard){

            navigator.clipboard
                .writeText(text + " " + url)
                .then(function(){

                    info.textContent =
                        "📋 Herausforderung kopiert – schick sie deinen Freunden!";

                });

        }

    }
);

/* =====================================================
   KRONIX LADEBILDSCHIRM
===================================================== */

let kronixProgress =
    0;

const kronixPercent =
    document.getElementById(
        "kronix-percent"
    );

const kronixLoading =
    document.getElementById(
        "kronix-loading"
    );


const kronixInterval =
    setInterval(
        function(){

            kronixProgress +=
                1;


            if(
                kronixProgress >=
                100
            ){

                kronixProgress =
                    100;

                clearInterval(
                    kronixInterval
                );


                setTimeout(
                    function(){

                        kronixLoading.style.transition =
                            "opacity .6s";

                        kronixLoading.style.opacity =
                            "0";


                        setTimeout(
                            function(){

                                kronixLoading.remove();

                            },
                            600
                        );

                    },
                    300
                );

            }


            kronixPercent.textContent =
                kronixProgress;

        },
        10
    );


/* =====================================================
   APP-INSTALLATION (PWA)
   Macht das Spiel auf Handys installierbar
   und offline spielbar.
===================================================== */

if("serviceWorker" in navigator){

    navigator.serviceWorker
        .register("./sw.js")
        .catch(function(){

            /* Ohne Service Worker laeuft das Spiel
               ganz normal weiter, nur ohne Offline-
               Modus und Installation. */

        });

}
