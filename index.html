<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Kronix Timer</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080b12;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    touch-action:manipulation;
}

button{
    cursor:pointer;
}

#gameArea{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

#timer{
    font-size:clamp(60px,18vw,125px);
    font-weight:800;
    letter-spacing:2px;
    text-align:center;
    pointer-events:none;
    transition:.15s;
}

#info{
    position:fixed;
    top:24px;
    left:50%;
    transform:translateX(-50%);
    width:80%;
    text-align:center;
    font-size:16px;
    opacity:.75;
    pointer-events:none;
}

#modeButton,
#designButton,
#profileButton,
#rankingButton{
    position:fixed;
    top:18px;
    z-index:50;
    border:0;
    border-radius:14px;
    padding:12px 16px;
    color:white;
    font-size:15px;
    font-weight:bold;
}

#modeButton{right:18px}
#designButton{left:18px}

#profileButton{
    right:18px;
    top:70px;
    padding:10px 13px;
}

#rankingButton{
    right:18px;
    top:122px;
    padding:10px 13px;
}

#modeMenu,
#designMenu{
    position:fixed;
    top:68px;
    width:250px;
    padding:9px;
    border-radius:18px;
    background:rgba(24,34,56,.97);
    box-shadow:0 20px 60px rgba(0,0,0,.55);
    display:none;
    z-index:100;
}

#modeMenu{
    right:18px;
    max-height:80vh;
    overflow-y:auto;
}

#designMenu{
    left:18px;
}

#modeMenu.open,
#designMenu.open{
    display:block;
}

.modeButton,
.designChoice{
    width:100%;
    margin:4px 0;
    padding:13px;
    border:0;
    border-radius:11px;
    background:#2b3955;
    color:white;
    text-align:left;
    font-size:15px;
}

.designChoice.active{
    outline:2px solid white;
}

#neonControl{
    margin-top:9px;
    padding-top:10px;
    border-top:1px solid rgba(255,255,255,.2);
}

#neonButton{
    width:100%;
    border:0;
    border-radius:11px;
    padding:13px;
    background:#111827;
    color:white;
    font-size:15px;
    font-weight:bold;
}

#panel{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:min(91%,440px);
    max-height:86vh;
    overflow-y:auto;
    padding:25px;
    border-radius:22px;
    background:#182238;
    box-shadow:0 25px 80px rgba(0,0,0,.65);
    display:none;
    z-index:200;
}

#panel.open{
    display:block;
}

#panel h2{
    margin-top:0;
}

input{
    width:100%;
    padding:14px;
    margin:5px 0 12px;
    border:0;
    border-radius:10px;
    font-size:17px;
    user-select:text;
}

.panelButton{
    width:100%;
    padding:14px;
    margin-top:8px;
    border:0;
    border-radius:11px;
    background:#2563eb;
    color:white;
    font-size:16px;
}

.panelButton.secondary{
    background:#475569;
}

.panelButton.danger{
    background:#dc2626;
}

#timer.perfect{
    animation:perfectAnimation .7s ease;
}

@keyframes perfectAnimation{
    0%{transform:scale(1)}
    35%{transform:scale(1.35)}
    65%{transform:scale(.9)}
    100%{transform:scale(1)}
}

#confettiCanvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:999;
}

/* =========================
   KONTO
========================= */

#accountScreen{
    position:fixed;
    inset:0;
    z-index:5000;
    background:#080b12;
    display:flex;
    align-items:center;
    justify-content:center;
}

.accountBox{
    width:min(90%,420px);
    background:#182238;
    border-radius:25px;
    padding:30px;
    box-shadow:0 25px 80px rgba(0,0,0,.7);
    text-align:center;
}

.accountLogo{
    font-size:42px;
    font-weight:1000;
    letter-spacing:7px;
    text-shadow:0 0 15px #0088ff;
}

.accountBox h2{
    margin:12px 0 25px;
}

.profileImage{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    margin:10px auto 20px;
    border:3px solid #168cff;
}

.rankRow{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    margin:6px 0;
    border-radius:10px;
    background:rgba(255,255,255,.07);
}

.rankNumber{
    width:35px;
    font-weight:bold;
}

.rankAvatar{
    width:38px;
    height:38px;
    border-radius:50%;
    object-fit:cover;
}

.rankName{
    flex:1;
    text-align:left;
}

.rankScore{
    font-weight:bold;
}

.smallText{
    opacity:.7;
    font-size:13px;
}

/* =========================
   LADEBILDSCHIRM
========================= */

#kronix-loading{
    position:fixed;
    inset:0;
    z-index:999999;
    background:
        radial-gradient(circle at center,#10243b 0%,#05080d 55%,#000 100%);
    overflow:hidden;
    color:white;
}

#kronix-dvd{
    position:absolute;
    left:5%;
    top:5%;
    text-align:center;
    animation:dvdMove 8s linear infinite;
}

.kronix-logo{
    font-size:clamp(45px,10vw,70px);
    font-weight:1000;
    letter-spacing:8px;
    color:white;
    text-shadow:
        0 0 8px #00aaff,
        0 0 20px #0088ff,
        0 0 45px #0055ff;
}

.kronix-subtitle{
    margin-top:8px;
    font-size:15px;
    font-weight:bold;
    letter-spacing:5px;
    color:#00aaff;
}

.kronix-loading-text{
    position:absolute;
    bottom:75px;
    width:100%;
    text-align:center;
    font-size:42px;
    font-weight:bold;
}

.kronix-status{
    position:absolute;
    bottom:38px;
    width:100%;
    text-align:center;
    font-size:14px;
    letter-spacing:5px;
    color:#00aaff;
}

@keyframes dvdMove{
    0%{left:5%;top:5%}
    25%{left:65%;top:25%}
    50%{left:45%;top:70%}
    75%{left:10%;top:45%}
    100%{left:5%;top:5%}
}

@media(max-width:600px){

    #modeButton,
    #designButton{
        top:12px;
        padding:11px 13px;
    }

    #modeButton{right:12px}
    #designButton{left:12px}

    #modeMenu,
    #designMenu{
        top:60px;
        width:225px;
    }

    #modeMenu{right:12px}
    #designMenu{left:12px}

    #profileButton{
        right:12px;
        top:62px;
    }

    #rankingButton{
        right:12px;
        top:112px;
    }

    #info{
        top:72px;
        font-size:14px;
    }

    #panel{
        padding:21px;
    }
}
</style>
</head>

<body>

========================= -->

<div id="kronix-loading">

    <div id="kronix-dvd">

        <div class="kronix-logo">
            KRONIX
        </div>

        <div class="kronix-subtitle">

<script>

/* =====================================================
   KONTO-SYSTEM
===================================================== */

let currentUser = null;
let accountLoginMode = false;

const accountScreen =
    document.getElementById("accountScreen");

const accountTitle =
    document.getElementById("accountTitle");

const accountDescription =
    document.getElementById("accountDescription");

const accountUsername =
    document.getElementById("accountUsername");

const accountPassword =
    document.getElementById("accountPassword");

const accountMainButton =
    document.getElementById("accountMainButton");

const accountSwitchButton =
    document.getElementById("accountSwitchButton");


function getAccounts(){

    try{

        return JSON.parse(
            localStorage.getItem(
                "kronixAccounts"
            ) || "{}"
        );

    }catch{

        return {};

    }
}


function saveAccounts(accounts){

    localStorage.setItem(
        "kronixAccounts",
        JSON.stringify(accounts)
    );

}


function updateAccountScreen(){

    const accounts =
        getAccounts();

    if(
        Object.keys(accounts).length === 0
    ){

        accountLoginMode = false;

        accountTitle.textContent =
            "Konto erstellen";

        accountDescription.textContent =
            "Erstelle dein Kronix-Konto.";

        accountMainButton.textContent =
            "Konto erstellen";

        accountSwitchButton.textContent =
            "Ich habe bereits ein Konto";

    }else{

        accountLoginMode = true;

        accountTitle.textContent =
            "Anmelden";

        accountDescription.textContent =
            "Melde dich mit deinem Benutzernamen und Passwort an.";

        accountMainButton.textContent =
            "Anmelden";

        accountSwitchButton.textContent =
            "Neues Konto erstellen";

    }

}


accountSwitchButton.onclick =
function(){

    accountLoginMode =
        !accountLoginMode;

    if(accountLoginMode){

        accountTitle.textContent =
            "Anmelden";

        accountDescription.textContent =
            "Benutzername und Passwort eingeben.";

        accountMainButton.textContent =
            "Anmelden";

        accountSwitchButton.textContent =
            "Neues Konto erstellen";

    }else{

        accountTitle.textContent =
            "Konto erstellen";

        accountDescription.textContent =
            "Erstelle dein Kronix-Konto.";

        accountMainButton.textContent =
            "Konto erstellen";

        accountSwitchButton.textContent =
            "Ich habe bereits ein Konto";

    }

};


accountMainButton.onclick =
function(){

    const username =
        accountUsername.value.trim();

    const password =
        accountPassword.value;

    if(username.length < 3){

        alert(
            "Der Benutzername muss mindestens 3 Zeichen haben."
        );

        return;

    }

    if(password.length < 4){

        alert(
            "Das Passwort muss mindestens 4 Zeichen haben."
        );

        return;

    }

    const accounts =
        getAccounts();

    /* LOGIN */

    if(accountLoginMode){

        if(!accounts[username]){

            alert(
                "Dieses Konto gibt es nicht."
            );

            return;

        }

        if(
            accounts[username].password !==
            password
        ){

            alert(
                "Falsches Passwort."
            );

            return;

        }

        currentUser =
            username;

        localStorage.setItem(
            "kronixLoggedIn",
            username
        );

        accountScreen.style.display =
            "none";

        updateRankingButton();

        return;

    }

    /* KONTO ERSTELLEN */

    if(accounts[username]){

        alert(
            "Dieser Benutzername ist bereits vergeben."
        );

        return;

    }

    accounts[username] = {

        password:password,

        image:"",

        perfects:0,

        ranks:{
            challenge:0,
            challengeBlind:0,
            oneSecond:0,
            fiveSecond:0,
            tenSecond:0
        },

        created:Date.now()

    };

    saveAccounts(accounts);

    currentUser =
        username;

    localStorage.setItem(
        "kronixLoggedIn",
        username
    );

    accountScreen.style.display =
        "none";

    updateRankingButton();

};


function loadSavedAccount(){

    const username =
        localStorage.getItem(
            "kronixLoggedIn"
        );

    const accounts =
        getAccounts();

    if(
        username &&
        accounts[username]
    ){

        currentUser =
            username;

        accountScreen.style.display =
            "none";

    }else{

        accountScreen.style.display =
            "flex";

    }

    updateAccountScreen();

}


function getCurrentAccount(){

    const accounts =
        getAccounts();

    return currentUser
        ? accounts[currentUser]
        : null;

}


function updateAccount(callback){

    const accounts =
        getAccounts();

    if(
        !currentUser ||
        !accounts[currentUser]
    ){

        return;

    }

    callback(
        accounts[currentUser]
    );

    saveAccounts(accounts);

}


/* =====================================================
   PROFIL
===================================================== */

const profileButton =
    document.getElementById(
        "profileButton"
    );

const panel =
    document.getElementById(
        "panel"
    );

const panelTitle =
    document.getElementById(
        "panelTitle"
    );

const panelContent =
    document.getElementById(
        "panelContent"
    );


profileButton.onclick =
function(){

    if(!currentUser)return;

    const account =
        getCurrentAccount();

    panelTitle.textContent =
        "👤 Mein Profil";

    panelContent.innerHTML = `

        <img
            class="profileImage"
            id="profilePreview"
            src="${
                account.image ||
                'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2290%22 height=%2290%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23334155%22/%3E%3Ctext x=%2250%22 y=%2260%22 text-anchor=%22middle%22 font-size=%2250%22%3E👤%3C/text%3E%3C/svg%3E'
            }">

        <h3>
            ${escapeHTML(currentUser)}
        </h3>

        <p>
            ⭐ 100%-Erfolge:
            <strong>
                ${account.perfects || 0}
            </strong>
        </p>

        <input
            id="profileImageInput"
            type="file"
            accept="image/*">

        <button
            class="panelButton"
            id="saveProfileImage">
            Profilbild speichern
        </button>

        <button
            class="panelButton danger"
            id="logoutButton">
            Abmelden
        </button>

        <button
            class="panelButton secondary"
            id="closeProfile">
            Schließen
        </button>

    `;

    panel.classList.add("open");

    let selectedImage =
        account.image || "";

    document.getElementById(
        "profileImageInput"
    ).onchange =
    function(){

        const file =
            this.files[0];

        if(!file)return;

        const reader =
            new FileReader();

        reader.onload =
        function(){

            selectedImage =
                reader.result;

            document.getElementById(
                "profilePreview"
            ).src =
                selectedImage;

        };

        reader.readAsDataURL(file);

    };


    document.getElementById(
        "saveProfileImage"
    ).onclick =
    function(){

        updateAccount(
            function(account){

                account.image =
                    selectedImage;

            }
        );

        panel.classList.remove(
            "open"
        );

    };


    document.getElementById(
        "logoutButton"
    ).onclick =
    function(){

        localStorage.removeItem(
            "kronixLoggedIn"
        );

        currentUser =
            null;

        panel.classList.remove(
            "open"
        );

        accountScreen.style.display =
            "flex";

        updateAccountScreen();

    };


    document.getElementById(
        "closeProfile"
    ).onclick =
    function(){

        panel.classList.remove(
            "open"
        );

    };

};


function escapeHTML(text){

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        );

}


/* =====================================================
   SPIEL-VARIABLEN
===================================================== */

let currentMode =
    "normal";

let running =
    false;

let startTime =
    0;

let elapsedTime =
    0;

let animationFrame =
    null;

let challengeTarget =
    0;

let resultVisible =
    false;

let resultTimer =
    null;

let friends = [];

let currentFriend =
    0;

let friendAttempts =
    10;

let currentAttempt =
    0;

let friendTarget =
    5;

let friendScores =
    [];

let currentDesign =
    "kronixBlue";

let neonEnabled =
    false;


/* =====================================================
   ELEMENTE
===================================================== */

const gameArea =
    document.getElementById(
        "gameArea"
    );

const timer =
    document.getElementById(
        "timer"
    );

const info =
    document.getElementById(
        "info"
    );

const modeButton =
    document.getElementById(
        "modeButton"
    );

const modeMenu =
    document.getElementById(
        "modeMenu"
    );

const designButton =
    document.getElementById(
        "designButton"
    );

const designMenu =
    document.getElementById(
        "designMenu"
    );

const neonButton =
    document.getElementById(
        "neonButton"
    );

const rankingButton =
    document.getElementById(
        "rankingButton"
    );

const confettiCanvas =
    document.getElementById(
        "confettiCanvas"
    );


/* =====================================================
   ZEIT
===================================================== */

function formatTime(milliseconds){

    const seconds =
        Math.floor(
            milliseconds / 1000
        );

    const hundredths =
        Math.floor(
            (milliseconds % 1000) / 10
        );

    return String(seconds)
        .padStart(2,"0")
        + "."
        +
        String(hundredths)
        .padStart(2,"0");

}


/* =====================================================
   GENAUIGKEIT
===================================================== */

function calculateAccuracy(
    actual,
    target
){

    if(target <= 0)
        return 0;

    const difference =
        Math.abs(
            actual - target
        );

    let accuracy =
        100 -
        (
            difference /
            target *
            100
        );

    accuracy =
        Math.max(
            0,
            accuracy
        );

    /*
       WICHTIG:
       Immer auf 2 Nachkommastellen
       runden.
    */

    return Math.round(
        accuracy * 100
    ) / 100;

}


function accuracyText(
    accuracy
){

    return accuracy
        .toFixed(2)
        .replace(".",",")
        + " %";

}


/*
   Ein echter Treffer:
   maximal 0,005 Sekunden Unterschied.
*/

function isPerfectTarget(
    actual,
    target
){

    return Math.abs(
        actual - target
    ) <= 0.005;

}


/* =====================================================
   RANG-LISTEN
===================================================== */

const rankingNames = {

    challenge:
        "🎯 Challenge",

    challengeBlind:
        "🎯🕶️ Challenge Blind",

    oneSecond:
        "🎯 Stoppe bei 1 Sekunde",

    fiveSecond:
        "🎯 Stoppe bei 5 Sekunden",

    tenSecond:
        "🎯 Stoppe bei 10 Sekunden"

};


function rankingAllowed(){

    return Object.prototype.hasOwnProperty.call(
        rankingNames,
        currentMode
    );

}


function updateRankingButton(){

    if(!rankingAllowed()){

        rankingButton.style.display =
            "none";

        return;

    }

    rankingButton.style.display =
        "block";

    const account =
        getCurrentAccount();

    const score =
        account &&
        account.ranks
        ? account.ranks[currentMode] || 0
        : 0;

    rankingButton.textContent =
        "🏆 " + score;

}


function addRankingPerfect(){

    if(!rankingAllowed())
        return;

    updateAccount(
        function(account){

            if(!account.ranks)
                account.ranks = {};

            account.ranks[currentMode] =
                Number(
                    account.ranks[currentMode] || 0
                ) + 1;

        }
    );

    updateRankingButton();

}


function addPerfect(){

    updateAccount(
        function(account){

            account.perfects =
                Number(
                    account.perfects || 0
                ) + 1;

        }
    );

    addRankingPerfect();

}


/* =====================================================
   RANGLISTE ANZEIGEN
===================================================== */

rankingButton.onclick =
function(){

    if(!rankingAllowed())
        return;

    showGlobalRanking();

function showGlobalRanking(){

    const accounts =
        getAccounts();

    const ranking =
        Object.entries(accounts)

        .map(
            function(entry){

                return {

                    username:
                        entry[0],

                    account:
                        entry[1],

                    score:
                        entry[1].ranks
                        ?
                        Number(
                            entry[1].ranks[
                                currentMode
                            ] || 0
                        )
                        :
                        0

                };

            }
        )

        .filter(
            player =>
                player.score > 0
        )

        .sort(
            (a,b) =>
                b.score -
                a.score
        );

    let html = "";

    ranking.forEach(
        function(player,index){

            const image =
                player.account.image ||
                "data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2238%22 height=%2238%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23334155%22/%3E%3Ctext x=%2250%22 y=%2260%22 text-anchor=%22middle%22 font-size=%2225%22%3E👤%3C/text%3E%3C/svg%3E";

            html += `

                <div class="rankRow">

                    <div class="rankNumber">
                        ${index + 1}.
                    </div>

                    <img
                        class="rankAvatar"

                            player.username

    );

        rankingNames[currentMode];

    panelContent.innerHTML = `

        <p class="smallText">
            Rangliste der 100%-Erfolge
            in diesem Modus

        ${
            html ||
            "<p>Noch keine 100%-Erfolge.</p>"

/* =====================================================
   KONFETTI
===================================================== */

function startConfetti(){

    const canvas =
        confettiCanvas;

    const ctx =
        canvas.getContext(
            "2d"
        );

    canvas.width =
        innerWidth;

    canvas.height =
        innerHeight;

    const colors = [

        "#00aaff",
        "#ffffff",
        "#0055ff",
        "#66ccff"

    ];

    const pieces = [];

    for(
        let i = 0;
        i < 150;
        i++
    ){

        pieces.push({

            x:
                innerWidth / 2,

            y:
                innerHeight / 2,

            vx:
                (Math.random() - .5) * 16,

            vy:
                (Math.random() - .8) * 16,

            size:
                Math.random() * 8 + 4,

            rotation:
                Math.random() * 360,

            rotationSpeed:
                (Math.random() - .5) * 16,

            life:
                1,

            color:
                colors[
                    Math.floor(
                        Math.random() *
                        colors.length
                    )
                ]

        });

    }

    function draw(){

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        let alive =
            false;

        pieces.forEach(
            function(piece){

                if(
                    piece.life <= 0
                )
                    return;

                alive =
                    true;

                piece.x +=
                    piece.vx;

                piece.y +=
                    piece.vy;

                piece.vy +=
                    .35;

                piece.rotation +=
                    piece.rotationSpeed;

                piece.life -=
                    .012;

                ctx.save();

                ctx.globalAlpha =
                    Math.max(
                        0,
                        piece.life
                    );

                ctx.translate(
                    piece.x,
                    piece.y
                );

                ctx.rotate(
                    piece.rotation *
                    Math.PI /
                    180
                );

                ctx.fillStyle =
                    piece.color;

                ctx.fillRect(
                    -piece.size / 2,
                    -piece.size / 2,
                    piece.size,
                    piece.size * 1.8
                );

                ctx.restore();

            }
        );

        if(alive){

            requestAnimationFrame(
                draw
            );

        }

    }

    draw();

}

function handleGameTap(){

    /*
       Ergebnis anklicken =
       neue Runde.
    */

    if(resultVisible){

        createNewTarget();

        return;

    }


    /*
       START
    */

    if(!running){

        startTime =
            performance.now();

        elapsedTime =
            0;

        running =
            true;


        if(
            currentMode ===
            "normal"
        ){

            info.textContent =
                "Tippe zum Stoppen";

        }


        if(
            currentMode ===
            "blind"
        ){

            info.textContent =
                "🕶️ Stoppe nach Gefühl";

        }


        if(
            currentMode ===
            "challenge"
        ){

            info.textContent =
                "🎯 Stoppe genau bei " +
                challengeTarget.toFixed(2) +
                " Sekunden";

        }


        if(
            currentMode ===
            "challengeBlind"
        ){

            info.textContent =
                "🎯🕶️ Stoppe nach Gefühl";

        }


        if(
            currentMode === "oneSecond" ||
            currentMode === "fiveSecond" ||
            currentMode === "tenSecond"
        ){

            info.textContent =
                "🎯 Stoppe genau bei " +
                challengeTarget.toFixed(2) +
                " Sekunden";

        }


        if(
            currentMode ===
            "friends"
        ){

            info.textContent =
                friends[currentFriend].name +
                " – Versuch " +
                (currentAttempt + 1) +
                " von " +
                friendAttempts;

        }

        updateTimer();

        return;

    }


    /*
       STOP
    */

    running =
        false;

    cancelAnimationFrame(
        animationFrame
    );

    elapsedTime =
        performance.now() -
        startTime;

    const actual =
        elapsedTime / 1000;


    if(
        currentMode === "normal" ||
        currentMode === "blind"
    ){

        timer.textContent =
            formatTime(
                elapsedTime
            );

        info.textContent =
            "Gestoppt bei " +
            formatTime(
                elapsedTime
            );

        return;

    }


    if(
        currentMode === "challenge" ||
        currentMode === "challengeBlind" ||
        currentMode === "oneSecond" ||
        currentMode === "fiveSecond" ||
        currentMode === "tenSecond"
    ){

        finishTarget(
            actual
        );

        return;

    }


    if(
        currentMode ===
        "friends"
    ){

        finishFriendAttempt();

    }

}

function finishTarget(

){

    timer.textContent =

        );


    if(
        isPerfectTarget(
            actual,

    ){

        info.textContent =
            "Gestoppt bei " +
            formatTime(
                elapsedTime
            ) +
            " – " +
            accuracyText(
                accuracy
            ) +
            " Genauigkeit";

    }


    resultVisible =
        true;


    resultTimer =
        setTimeout(
            function(){

                if(
                    !running &&
                    resultVisible
                ){

                    timer.textContent =
                        accuracyText(
                            accuracy
                        );

                    info.textContent =
                        "🎯 Genauigkeit";

                }

            },
            2000
        );

}

        const target =

                ).value
            );


        if(

            target <= 0
        ){

            return;

        }


        friends = [

            {
                name:name,
                scores:[],
                average:0
            }

        ];


        currentFriend =
            0;

        friendAttempts =
            count;

        currentAttempt =
            0;

        friendTarget =
            target;

        friendScores =
            [];


        panel.classList.remove(
            "open"
        );


        timer.textContent =
            "00.00";

        info.textContent =
            name +
            " ist bereit – Ziel " +
            target.toFixed(2) +
            " Sekunden";

    };

}


function finishFriendAttempt(){

    const actual =
        elapsedTime / 1000;

    const accuracy =
        calculateAccuracy(
            actual,
            friendTarget
        );


    friendScores.push(
        accuracy
    );

    currentAttempt++;


    timer.textContent =
        formatTime(
            elapsedTime
        );


    if(
        isPerfectTarget(
            actual,
            friendTarget
        )
    ){

        info.textContent =
            "🔥 PERFEKT! 100%";

    }else{

        info.textContent =
            accuracyText(
                accuracy
            ) +
            " Genauigkeit";

    }


    if(
        currentAttempt >=
        friendAttempts
    ){

        const average =
            Math.round(
                (
                    friendScores.reduce(
                        (sum,value) =>
                            sum + value,
                        0
                    ) /
                    friendScores.length
                ) * 100
            ) / 100;


        friends[currentFriend].scores =
            friendScores.slice();

        friends[currentFriend].average =
            average;


        setTimeout(
            showFriendResult,
            500
        );

    }

}
